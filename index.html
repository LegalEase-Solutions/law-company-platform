    body: "<div style=\"min-height: 1260px; display: flex; flex-wrap: wrap; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1c1c1a; background: #ffffff\">\n\n  <nav aria-label=\"Main\" style=\"flex: 1 1 232px; max-width: 232px; min-width: 200px; background: #f5f5f3; border-right: 1px solid #dcdcd8; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px\">\n    <div style=\"display: flex; align-items: center; gap: 10px; padding: 0 8px\">\n      <div style=\"width: 32px; height: 32px; border: 1.5px solid #1c1c1a; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 9px\">LOGO<\/div>\n      <div style=\"font-weight: 600; font-size: 16px\">Law Company<\/div>\n    <\/div>\n    <div style=\"display: flex; flex-direction: column; gap: 4px\">\n      <a href=\"Home.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z\"><\/path><\/svg>Home<\/a>\n      <a href=\"Matters.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"><\/path><\/svg>Matters<\/a>\n      <a href=\"Projects.dc.html\" class=\"navlink\" aria-current=\"page\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; background: #ffffff; border: 1px solid #dcdcd8; font-weight: 500; font-size: 15px\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M22 2 11 13\"><\/path><path d=\"M22 2 15 22l-4-9-9-4z\"><\/path><\/svg><span style=\"flex: 1\">Projects<\/span><span style=\"font-size: 11px; font-family: 'IBM Plex Mono', monospace; padding: 2px 7px; background: #1c1c1a; color: #ffffff\">2<\/span><\/a>\n      <a href=\"Workflows.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"2.5\"><\/circle><circle cx=\"18\" cy=\"18\" r=\"2.5\"><\/circle><path d=\"M8.5 6H15a3 3 0 0 1 3 3v6.5M6 8.5V15a3 3 0 0 0 3 3h6.5\"><\/path><\/svg>Workflows<\/a>\n      <a href=\"Chat.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M4 5h16v11H9l-5 4z\"><\/path><\/svg>Chat<\/a>\n      <div style=\"margin: 14px 12px 4px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #5c5c58\">Firm resources<\/div>\n      <a href=\"Library.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M4 4h5a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z\"><\/path><path d=\"M20 4h-5a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h6z\"><\/path><\/svg>Library<\/a>\n      <a href=\"Connectors.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5\"><\/path><\/svg>Connectors<\/a>\n      <div style=\"margin: 14px 12px 4px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #5c5c58\">Firm admin<\/div>\n      <a href=\"Reports.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\/path><\/svg>Reports<\/a>\n      <a href=\"Admin.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z\"><\/path><path d=\"M9 12l2 2 4-4\"><\/path><\/svg>Admin dashboard<\/a>\n    <\/div>\n    <div style=\"margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-top: 1px solid #dcdcd8\">\n      <div style=\"width: 36px; height: 36px; border-radius: 50%; background: #dcdcd8; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">JD<\/div>\n      <div style=\"display: flex; flex-direction: column; font-size: 13px; line-height: 1.35\">\n        <span style=\"font-weight: 500\">[Attorney Name]<\/span>\n        <span style=\"color: #5c5c58\">[Firm / Client]<\/span>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; padding: 40px 48px 64px; box-sizing: border-box; display: flex; flex-wrap: nowrap; align-items: flex-start; gap: 32px\">\n    <div style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n\n      <header style=\"display: flex; flex-direction: column; gap: 6px\">\n        <div style=\"font-size: 13px; color: #5c5c58\"><a href=\"Home.dc.html\">Home<\/a> / <a href=\"Projects.dc.html\">Projects<\/a> / New project<\/div>\n        <h1 style=\"margin: 0; font-size: 32px; font-weight: 600\">Submit a project to LawCompany<\/h1>\n        <p style=\"margin: 0; font-size: 15px; color: #4a4a46\">Hand the work to our team. We'll scope it, send an hour estimate for your approval, keep you updated, and deliver the final work product here.<\/p>\n      <\/header>\n\n      <form style=\"display: flex; flex-direction: column; gap: 24px\">\n        <fieldset style=\"margin: 0; border: 1px solid #dcdcd8; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n          <legend style=\"padding: 0 8px; font-size: 16px; font-weight: 600\">1 · The request<\/legend>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <label for=\"ptitle\" style=\"font-size: 14px; font-weight: 500\">Project title<\/label>\n            <input id=\"ptitle\" value=\"Northside warehouse lease review\" style=\"height: 44px; border: 1px solid #b8b8b2; padding: 0 12px; font-family: inherit; font-size: 15px\">\n          <\/div>\n          <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"pmatter\" style=\"font-size: 14px; font-weight: 500\">Matter<\/label>\n              <select id=\"pmatter\" style=\"height: 44px; border: 1px solid #b8b8b2; padding: 0 10px; font-family: inherit; font-size: 14px; background: #ffffff\">\n                <option>Northside Plaza ground lease<\/option>\n                <option>Acme Holdings v. Delta Supply<\/option>\n                <option>Harbor Foods vendor MSA<\/option>\n                <option>+ Create a new matter<\/option>\n                <option>No matter<\/option>\n              <\/select>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"ptype\" style=\"font-size: 14px; font-weight: 500\">Type of work<\/label>\n              <select id=\"ptype\" style=\"height: 44px; border: 1px solid #b8b8b2; padding: 0 10px; font-family: inherit; font-size: 14px; background: #ffffff\">\n                <option>Contract review<\/option><option>Drafting<\/option><option>Research memo<\/option><option>Litigation support<\/option><option>Discovery / document review<\/option><option>Other<\/option>\n              <\/select>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"pdue\" style=\"font-size: 14px; font-weight: 500\">Needed by<\/label>\n              <input id=\"pdue\" type=\"text\" value=\"Nov 13, 2026\" style=\"height: 44px; border: 1px solid #b8b8b2; padding: 0 12px; font-family: inherit; font-size: 15px\">\n            <\/div>\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <label for=\"pneed\" style=\"font-size: 14px; font-weight: 500\">What do you need?<\/label>\n            <textarea id=\"pneed\" rows=\"4\" style=\"border: 1px solid #b8b8b2; padding: 12px; font-family: inherit; font-size: 15px; line-height: 1.5; resize: vertical\">We are renewing the Northside warehouse lease. Flag anything off-market in rent escalation, maintenance and early termination, and suggest redlines.<\/textarea>\n          <\/div>\n          <div role=\"radiogroup\" aria-label=\"Priority\" style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\">\n            <span style=\"font-size: 14px; font-weight: 500; margin-right: 6px\">Priority<\/span>\n            <sc-for list=\"{{priorities}}\" as=\"o\" hint-placeholder-count=\"2\">\n              <button type=\"button\" role=\"radio\" aria-checked=\"{{o.checked}}\" onClick=\"{{o.pick}}\" style=\"{{o.style}}\">{{o.label}}<\/button>\n            <\/sc-for>\n          <\/div>\n        <\/fieldset>\n\n        <fieldset style=\"margin: 0; border: 1px solid #dcdcd8; padding: 24px; display: flex; flex-direction: column; gap: 14px\">\n          <legend style=\"padding: 0 8px; font-size: 16px; font-weight: 600\">2 · Outcomes and deliverables<\/legend>\n          <p style=\"margin: 0; font-size: 14px; color: #4a4a46\">List what you want back and when. LawCompany may propose changes when it sends the estimate.<\/p>\n          <div style=\"border: 1px solid #dcdcd8; overflow-x: auto\">\n            <div style=\"min-width: 600px\">\n              <div style=\"display: grid; grid-template-columns: 2.4fr 1fr 1fr 44px; gap: 12px; padding: 10px 14px; background: #f5f5f3; font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; color: #5c5c58\">\n                <span>Deliverable<\/span><span>Format<\/span><span>Due<\/span><span><\/span>\n              <\/div>\n              <sc-for list=\"{{deliverables}}\" as=\"d\" hint-placeholder-count=\"2\">\n                <div style=\"display: grid; grid-template-columns: 2.4fr 1fr 1fr 44px; gap: 12px; padding: 10px 14px; border-top: 1px solid #dcdcd8; align-items: center; font-size: 14px\">\n                  <span>{{d.name}}<\/span><span>{{d.format}}<\/span><span>{{d.due}}<\/span>\n                  <button type=\"button\" aria-label=\"Remove deliverable\" style=\"width: 40px; height: 40px; border: none; background: none; font-size: 18px; cursor: pointer\">×<\/button>\n                <\/div>\n              <\/sc-for>\n            <\/div>\n          <\/div>\n          <button type=\"button\" style=\"align-self: flex-start; height: 40px; padding: 0 14px; background: #ffffff; border: 1px solid #1c1c1a; font-family: inherit; font-size: 14px; cursor: pointer\">+ Add deliverable<\/button>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"pcontact\" style=\"font-size: 14px; font-weight: 500\">Contact for questions<\/label>\n              <input id=\"pcontact\" value=\"[Attorney Name] · [email]\" style=\"height: 44px; border: 1px solid #b8b8b2; padding: 0 12px; font-family: inherit; font-size: 15px\">\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"papprover\" style=\"font-size: 14px; font-weight: 500\">Approves the final work<\/label>\n              <select id=\"papprover\" style=\"height: 44px; border: 1px solid #b8b8b2; padding: 0 10px; font-family: inherit; font-size: 14px; background: #ffffff\">\n                <option>[Attorney Name] (you)<\/option><option>[Partner Name]<\/option>\n              <\/select>\n            <\/div>\n          <\/div>\n        <\/fieldset>\n\n        <fieldset style=\"margin: 0; border: 1px solid #dcdcd8; padding: 24px; display: flex; flex-direction: column; gap: 14px\">\n          <legend style=\"padding: 0 8px; font-size: 16px; font-weight: 600\">3 · Files<\/legend>\n          <label for=\"pfiles\" style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 20px; border: 1px dashed #8a8a84; background: #fafaf8; text-align: center; cursor: pointer\">\n            <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"1.6\" aria-hidden=\"true\"><path d=\"M12 16V4M6 10l6-6 6 6M4 20h16\"><\/path><\/svg>\n            <span style=\"font-size: 15px; font-weight: 500\">Drag files here or browse<\/span>\n            <span style=\"font-size: 13px; color: #5c5c58\">PDF, DOCX, XLSX, EML or ZIP · up to 200 MB each<\/span>\n            <input id=\"pfiles\" type=\"file\" multiple=\"\" style=\"position: absolute; width: 1px; height: 1px; opacity: 0\">\n          <\/label>\n          <button type=\"button\" style=\"align-self: flex-start; height: 40px; padding: 0 14px; background: #ffffff; border: 1px solid #b8b8b2; font-family: inherit; font-size: 14px; cursor: pointer\">Add from this matter's documents<\/button>\n          <ul style=\"margin: 0; padding: 0; list-style: none; border: 1px solid #dcdcd8\">\n            <li style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #dcdcd8\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 14px\">Northside lease (2021, executed).pdf<\/span><span style=\"font-size: 12px; color: #5c5c58\">From matter documents · 4.2 MB<\/span><\/span><button type=\"button\" aria-label=\"Remove file\" style=\"width: 40px; height: 40px; border: none; background: none; font-size: 18px; cursor: pointer\">×<\/button><\/li>\n            <li style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px\"><span style=\"display: flex; flex-direction: column\"><span style=\"font-size: 14px\">Landlord renewal proposal.docx<\/span><span style=\"font-size: 12px; color: #5c5c58\">Uploaded · 310 KB<\/span><\/span><button type=\"button\" aria-label=\"Remove file\" style=\"width: 40px; height: 40px; border: none; background: none; font-size: 18px; cursor: pointer\">×<\/button><\/li>\n          <\/ul>\n          <p style=\"margin: 0; font-size: 13px; color: #5c5c58\">Files are shared only with the LawCompany team staffed on this project.<\/p>\n        <\/fieldset>\n      <\/form>\n    <\/div>\n\n    <aside aria-label=\"Actions\" style=\"{{railStyle}}\">\n      <sc-if value=\"{{railOpen}}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 20px\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between\">\n            <span style=\"font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #4a4a46\">Actions<\/span>\n            <button type=\"button\" onClick=\"{{toggleRail}}\" aria-label=\"Collapse actions panel\" aria-expanded=\"true\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #b8b8b2; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg><\/button>\n          <\/div>\n\n          <section aria-labelledby=\"snext\" style=\"border: 1px solid #1c1c1a; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n            <h2 id=\"snext\" style=\"margin: 0; font-size: 16px; font-weight: 600\">Next action<\/h2>\n            <p style=\"margin: 0; font-size: 13px; color: #4a4a46; line-height: 1.5\">Send the request to the LawCompany team. Nothing is billed until you approve the estimate.<\/p>\n            <a href=\"ProjectDetail.dc.html\" style=\"height: 48px; display: flex; align-items: center; justify-content: center; background: {{accent}}; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 500\">Submit project<\/a>\n            <a href=\"Projects.dc.html\" style=\"height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #1c1c1a; text-decoration: none; font-size: 14px\">Save as draft<\/a>\n          <\/section>\n\n          <section aria-labelledby=\"sflow\" style=\"border: 1px solid #dcdcd8; padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n            <h2 id=\"sflow\" style=\"margin: 0; font-size: 15px; font-weight: 600\">What happens next<\/h2>\n            <ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.45\">\n              <sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"5\">\n                <li style=\"display: flex; gap: 10px\"><span style=\"flex: none; width: 22px; height: 22px; border: 1px solid #1c1c1a; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: 'IBM Plex Mono', monospace\">{{s.n}}<\/span><span>{{s.text}}<\/span><\/li>\n              <\/sc-for>\n            <\/ol>\n          <\/section>\n\n          <section aria-labelledby=\"shours\" style=\"border: 1px solid #dcdcd8; padding: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 13px\">\n            <h2 id=\"shours\" style=\"margin: 0; font-size: 15px; font-weight: 600\">Your hours<\/h2>\n            <div style=\"display: flex; justify-content: space-between\"><span style=\"color: #4a4a46\">Left this month<\/span><span style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 500\">18.5 of 40<\/span><\/div>\n            <div style=\"display: flex; justify-content: space-between\"><span style=\"color: #4a4a46\">Committed to open projects<\/span><span style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 500\">6.0<\/span><\/div>\n            <span style=\"color: #5c5c58; line-height: 1.5\">Project time counts against monthly hours once you approve its estimate.<\/span>\n          <\/section>\n        <\/div>\n      <\/sc-if>\n      <sc-if value=\"{{railClosed}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 14px\">\n          <button type=\"button\" onClick=\"{{toggleRail}}\" aria-label=\"Expand actions panel\" aria-expanded=\"false\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #b8b8b2; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"><\/path><\/svg><\/button>\n          <span role=\"img\" aria-label=\"1 next action\" style=\"min-width: 28px; height: 28px; padding: 0 6px; box-sizing: border-box; border-radius: 14px; background: #1c1c1a; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">1<\/span>\n          <span style=\"writing-mode: vertical-rl; font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #4a4a46\">Next action<\/span>\n        <\/div>\n      <\/sc-if>\n    <\/aside>\n  <\/main>\n<\/div>",
    Logic: (function () {
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { priority: 'standard' };
  }
  renderVals() {
    var self = this;
    var railOpen = !this.state.railClosed;
    var base = 'height: 40px; padding: 0 16px; font-family: inherit; font-size: 14px; cursor: pointer; ';
    var opts = [{ id: 'standard', label: 'Standard' }, { id: 'rush', label: 'Rush (under 3 business days)' }];
    return {
      railOpen: railOpen,
      railClosed: !railOpen,
      railStyle: 'flex: 0 0 ' + (railOpen ? '340px; width: 340px' : '44px; width: 44px') + '; min-width: 0; position: sticky; top: 24px',
      toggleRail: function () { self.setState({ railClosed: railOpen }); },
      accent: this.props.accent ?? '#1c1c1a',
      priorities: opts.map(function (o) {
        var on = o.id === self.state.priority;
        return { label: o.label, checked: on ? 'true' : 'false', pick: function () { self.setState({ priority: o.id }); },
          style: base + (on ? 'background: #1c1c1a; color: #ffffff; border: 1px solid #1c1c1a' : 'background: #ffffff; color: #1c1c1a; border: 1px solid #b8b8b2') };
      }),
      deliverables: [
        { name: 'Issues list: off-market terms with recommended positions', format: 'Memo (.docx)', due: 'Nov 6' },
        { name: 'Redline of landlord renewal proposal', format: 'Tracked changes (.docx)', due: 'Nov 13' }
      ],
      steps: [
        { n: '1', text: 'The LawCompany team reviews your request, usually within one business day.' },
        { n: '2', text: 'You get an hour estimate and confirmed deliverables and dates to approve.' },
        { n: '3', text: 'Status updates and questions appear on the project page and by email.' },
        { n: '4', text: 'Drafts come to you for review; you approve or send comments.' },
        { n: '5', text: 'After your approval, the final deliverable is released and saved to the matter.' }
      ]
    };
  }
}

    return Component; })()
  },

display: flex; flex-direction: column; font-size: 13px; line-height: 1.35\">\n        <span style=\"font-weight: 500\">[Attorney Name]<\/span>\n        <span style=\"color: #5c5c58\">[Firm / Client]<\/span>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; padding: 40px 48px 64px; box-sizing: border-box; display: flex; flex-wrap: nowrap; align-items: flex-start; gap: 32px\">\n    <div style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n\n      <header style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between\">\n        <div style=\"display: flex; flex-direction: column; gap: 4px\">\n          <h1 style=\"margin: 0; font-size: 32px; font-weight: 600\">Projects<\/h1>\n          <p style=\"margin: 0; font-size: 15px; color: #4a4a46\">Full projects and quick LawCompany reviews you've handed to the LawCompany team, across all your matters.<\/p>\n        <\/div>\n        <a href=\"Submit.dc.html\" style=\"height: 44px; padding: 0 20px; display: flex; align-items: center; background: {{accent}}; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 500\">+ Submit a project<\/a>\n      <\/header>\n\n      <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px\">\n        <div style=\"border: 1px solid #1d4f91; background: #f2f6fc; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 13px; color: #1d4f91\">Need your response<\/span><span style=\"font-size: 26px; font-weight: 600; font-family: 'IBM Plex Mono', monospace\">2<\/span><\/div>\n        <div style=\"border: 1px solid #dcdcd8; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 13px; color: #5c5c58\">In progress<\/span><span style=\"font-size: 26px; font-weight: 600; font-family: 'IBM Plex Mono', monospace\">3<\/span><\/div>\n        <div style=\"border: 1px solid #dcdcd8; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 13px; color: #5c5c58\">Hours committed<\/span><span style=\"font-size: 26px; font-weight: 600; font-family: 'IBM Plex Mono', monospace\">12.5<\/span><\/div>\n        <div style=\"border: 1px solid #dcdcd8; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\"><span style=\"font-size: 13px; color: #5c5c58\">Delivered this month<\/span><span style=\"font-size: 26px; font-weight: 600; font-family: 'IBM Plex Mono', monospace\">2<\/span><\/div>\n      <\/div>\n\n      <div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 1px solid #dcdcd8\">\n        <div role=\"tablist\" aria-label=\"Project state\" style=\"display: flex; gap: 4px\">\n          <sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"2\">\n            <button type=\"button\" role=\"tab\" aria-selected=\"{{t.selected}}\" onClick=\"{{t.pick}}\" style=\"{{t.style}}\">{{t.label}}<\/button>\n          <\/sc-for>\n        <\/div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px; padding-bottom: 12px; align-items: flex-end\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <label for=\"psearch\" style=\"font-size: 13px; font-weight: 500\">Search<\/label>\n            <input id=\"psearch\" type=\"search\" placeholder=\"Title, number or file\" style=\"width: 240px; height: 40px; border: 1px solid #b8b8b2; padding: 0 12px; font-family: inherit; font-size: 14px\">\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <label for=\"pmat\" style=\"font-size: 13px; font-weight: 500\">Matter<\/label>\n            <select id=\"pmat\" style=\"height: 40px; min-width: 190px; border: 1px solid #b8b8b2; padding: 0 10px; font-family: inherit; font-size: 14px; background: #ffffff\">\n              <option>All matters<\/opti olor: #4a4a46\">Confirm liability cap fallback · sent Oct 21<\/span><\/div>\n              <a href=\"ProjectDetail.dc.html\" style=\"align-self: flex-start; height: 36px; padding: 0 14px; display: flex; align-items: center; background: #1d4f91; color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 500\">Respond<\/a>\n            <\/div>\n            <div style=\"background: #ffffff; border: 1px solid #b9cfee; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px\">\n              <div style=\"display: flex; flex-direction: column; gap: 3px\"><span style=\"font-size: 11px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; color: #1d4f91\">Estimate<\/span><span style=\"font-size: 14px; font-weight: 500\">Northside warehouse lease review<\/span><span style=\"font-size: 12px; color: #4a4a46\">6.5 hrs · 2 deliverables · Nov 13<\/span><\/div>\n              <a href=\"ProjectDetail.dc.html\" style=\"align-self: flex-start; height: 36px; padding: 0 14px; display: flex; align-items: center; background: #1d4f91; color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 500\">Review estimate<\/a>\n            <\/div>\n          <\/section>\n\n          <section aria-labelledby=\"pready\" style=\"border: 1px solid #dcdcd8; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n            <h2 id=\"pready\" style=\"margin: 0; font-size: 15px; font-weight: 600\">Final deliverable ready<\/h2>\n            <span style=\"font-size: 13px\">Demand letter to Delta Supply, final.pdf<\/span>\n            <span style=\"font-size: 12px; color: #5c5c58\">Released Oct 22 · saved to Acme v. Delta / Correspondence<\/span>\n            <div style=\"display: flex; gap: 8px\">\n              <button type=\"button\" style=\"height: 36px; padding: 0 12px; background: #ffffff; border: 1px solid #1c1c1a; font-family: inherit; font-size: 13px; cursor: pointer\">Download<\/button>\n              <a href=\"ProjectDetail.dc.html\" style=\"height: 36px; padding: 0 12px; display: flex; align-items: center; border: 1px solid #b8b8b2; box-sizing: border-box; text-decoration: none; font-size: 13px\">Accept and close<\/a>\n            <\/div>\n          <\/section>\n        <\/div>\n      <\/sc-if>\n      <sc-if value=\"{{railClosed}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 14px\">\n          <button type=\"button\" onClick=\"{{toggleRail}}\" aria-label=\"Expand actions panel\" aria-expanded=\"false\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #b8b8b2; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"><\/path><\/svg><\/button>\n          <span role=\"img\" aria-label=\"2 items waiting for approval\" style=\"min-width: 28px; height: 28px; padding: 0 6px; box-sizing: border-box; border-radius: 14px; background: #1d4f91; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">2<\/span>\n          <span style=\"writing-mode: vertical-rl; font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #4a4a46\">Attorney approval<\/span>\n        <\/div>\n      <\/sc-if>\n    <\/aside>\n  <\/main>\n<\/div>",

yle=\"color: #5c5c58\">{{m.when}}<\/span><\/div>\n                <p style=\"margin: 0; font-size: 14px; line-height: 1.55\">{{m.text}}<\/p>\n                <sc-if value=\"{{m.hasFile}}\" hint-placeholder-val=\"{{ false }}\">\n                  <a href=\"Output.dc.html\" class=\"file\" style=\"align-self: flex-start; display: flex; gap: 10px; align-items: center; padding: 8px 12px; border: 1px solid #b8b8b2; background: #ffffff; text-decoration: none; font-size: 13px\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; border: 1px solid #b8b8b2; padding: 2px 4px\">DOCX<\/span>{{m.file}}<\/a>\n                <\/sc-if>\n              <\/li>\n            <\/sc-for>\n          <\/ol>\n          <form style=\"border: 1px solid #1c1c1a; display: flex; flex-direction: column\">\n            <label for=\"reply\" style=\"padding: 12px 14px 0; font-size: 13px; font-weight: 500\">Message the LawCompany team<\/label>\n            <textarea id=\"reply\" rows=\"3\" placeholder=\"Comments, clarifications or new instructions\" style=\"border: none; padding: 10px 14px; font-family: inherit; font-size: 14px; resize: vertical\"><\/textarea>\n            <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-top: 1px solid #dcdcd8; background: #fafaf8\">\n              <button type=\"button\" style=\"height: 36px; padding: 0 12px; background: #ffffff; border: 1px solid #b8b8b2; font-family: inherit; font-size: 13px; cursor: pointer\">Attach file<\/button>\n              <button type=\"button\" style=\"height: 40px; padding: 0 18px; background: {{accent}}; color: #ffffff; border: none; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer\">Send<\/button>\n            <\/div>\n          <\/form>\n        <\/section>\n\n        <section aria-labelledby=\"pfiles\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\">\n          <div style=\"border: 1px solid #dcdc display: flex; flex-direction: column; font-size: 13px; line-height: 1.35\">\n        <span style=\"font-weight: 500\">[Attorney Name]<\/span>\n        <span style=\"color: #5c5c58\">[Firm / Client]<\/span>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; padding: 40px 48px 64px; box-sizing: border-box; display: flex; flex-wrap: nowrap; align-items: flex-start; gap: 32px\">\n    <div style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 24px; max-width: 880px\">\n      <header style=\"display: flex; flex-direction: column; gap: 6px\">\n        <div style=\"font-size: 13px; color: #5c5c58\"><a href=\"Workflows.dc.html\">Workflows<\/a> / <a href=\"WorkflowRun.dc.html\">Notice &amp; Demand<\/a> / Send for review<\/div>\n        <h1 style=\"margin: 0; font-size: 30px; font-weight: 600\">Who should review this?<\/h1>\n        <p style=\"margin: 0; font-size: 15px; color: #4a4a46\">Keep the review inside your firm, or hand it to LawCompany to check or finish.<\/p>\n      <\/header>\n\n      <div role=\"radiogroup\" aria-label=\"Reviewer\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n        <sc-for list=\"{{whoOptions}}\" as=\"w\" hint-placeholder-count=\"2\">\n          <button type=\"button\" role=\"radio\" aria-checked=\"{{w.checked}}\" onClick=\"{{w.pick}}\" style=\"{{w.style}}\">\n            <span style=\"display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600\"><span style=\"{{w.dot}}\" aria-hidden=\"true\"><\/span>{{w.title}}<\/span>\n            <span style=\"font-size: 14px; line-height: 1.5; color: #4a4a46\">{{w.desc}}<\/span>\n            <span style=\"font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: #4a4a46\">{{w.meta}}<\/span>\n          <\/button>\n        <\/sc-for>\n      <\/div>\n\n      <section aria-labelledby=\"sritem\" style=\"border: 1px solid #dcdcd8; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px\">\n        <h2 id=\"sritem\" style=\"margin: 0; font-size: 15px; font-weight: 600\">What's being sent<\/h2>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px\">\n          <span style=\"padding: 6px 10px; border: 1px solid #1c1c1a\">Notice of breach (draft v1).docx<\/span>\n          <span style=\"padding: 6px 10px; border: 1px solid #b8b8b2\">Matter overview + case insights<\/span>\n          <span style=\"padding: 6px 10px; border: 1px solid #b8b8b2\">3 source files<\/span>\n        <\/div>\n        <span style=\"font-size: 13px; color: #4a4a46\">From the Notice &amp; Demand workflow run · Matter: Acme Holdings v. Delta Supply<\/span>\n      <\/section>\n\n      <sc-if value=\"{{isFirm}}\" hint-placeholder-val=\"{{ false }}\">\n        <section aria-labelledby=\"srfirm\" style=\"border: 1px solid #dcdcd8; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n          <h2 id=\"srfirm\" style=\"margin: 0; font-size: 16px; font-weight: 600\">Attorney review in your firm<\/h2>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"srwho\" style=\"font-size: 14px; font-weight: 500\">Reviewing attorney<\/label><select id=\"srwho\" style=\"height: 44px; border: 1px solid #b8b8b2; padding: 0 10px; font-family: inherit; font-size: 14px; background: #ffffff\"><option>[Attorney Name] (you)<\/option><option>[Partner Name]<\/option><\/select><\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"srwhen\" style=\"font-size: 14px; font-weight: 500\">Review by<\/label><input id=\"srwhen\" value=\"Oct 26, 2026\" style=\"height: 44px; border: 1px solid #b8b8b2; padding: 0 12px; font-family: inherit; font-size: 14px\"><\/div>\n          <\/div>\n          <span style=\"font-size: 13px; color: #4a4a46\">It goes to their review queue. No LawCompany hours are used.<\/span>\n        <\/section>\n      <\/sc-if>\n\n      <sc-if value=\"{{isLc}}\" hint-placeholder-val=\"{{ true }}\">\n        <section aria-labelledby=\"srlc\" style=\"border: 1px solid #1c1c1a; padding: 20px; display: flex; flex-direction: column; gap: 16px\">\n          <h2 id=\"srlc\" style=\"margin: 0; font-size: 16px; font-weight: 600\">LawCompany review<\/h2>\n          <div role=\"radiogroup\" aria-label=\"What LawCompany should do\" style=\"display: flex; flex-direction: column; gap: 8px\">\n            <sc-for list=\"{{kinds}}\" as=\"k\" hint-placeholder-count=\"3\">\n              <button type=\"button\" role=\"radio\" aria-checked=\"{{k.checked}}\" onClick=\"{{k.pick}}\" style=\"{{k.style}}\"><span style=\"{{k.dot}}\" aria-hidden=\"true\"><\/span><span style=\"display: flex; flex-direction: column; gap: 2px; text-align: left\"><span style=\"font-weight: 500\">{{k.title}}<\/span><span style=\"font-size: 13px; color: #4a4a46\">{{k.desc}}<\/span><\/span><\/button>\n            <\/sc-for>\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <label for=\"srnote\" style=\"font-size: 14px; font-weight: 500\">Note to LawCompany<\/label>\n            <textarea id=\"srnote\" rows=\"3\" style=\"border: 1px solid #b8b8b2; padding: 10px 12px; font-family: inherit; font-size: 14px; resize: vertical\">Check the § 9.2 analysis against the July emails and tighten the demand paragraph. We plan to send it Monday.<\/textarea>\n          <\/div>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px\"><label for=\"srdue\" style=\"font-size: 14px; font-weight: 500\">Needed by<\/label><input id=\"srdue\" value=\"Oct 26, 2026\" style=\"height: 44px; border: 1px solid #b8b8b2; padding: 0 12px; font-family: inherit; font-size: 14px\"><\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 6px\"><span style=\"font-size: 14px; font-weight: 500\">Hours<\/span><span style=\"min-height: 44px; display: flex; align-items: center; font-size: 14px; font-family: 'IBM Plex Mono', monospace\">Up to 2.0 · 18.5 left this month<\/span><\/div>\n          <\/div>\n          <p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #4a4a46; padding: 10px 12px; background: #fafaf8; border: 1px solid #dcdcd8\">Quick reviews skip the estimate step. LawCompany asks before going over 2 hours, and every result passes LawCompany QC before it reaches your review page. Need more than a review? <a href=\"Submit.dc.html\">Submit a full project<\/a>.<\/p>\n        <\/section>\n      <\/sc-if>\n    <\/div>\n\n    <aside aria-label=\"Actions\" style=\"{{railStyle}}\">\n      <sc-if value=\"{{railOpen}}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 20px\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between\">\n            <span style=\"font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #4a4a46\">Actions<\/span>\n            <button type=\"button\" onClick=\"{{toggleRail}}\" aria-label=\"Collapse actions panel\" aria-expanded=\"true\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #b8b8b2; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg><\/button>\n          <\/div>\n          <section aria-labelledby=\"srnext\" style=\"border: 1px solid #1c1c1a; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n            <h2 id=\"srnext\" style=\"margin: 0; font-size: 16px; font-weight: 600\">Next action<\/h2>\n            <p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #4a4a46\">{{nextText}}<\/p>\n            <a href=\"{{sendHref}}\" style=\"height: 48px; display: flex; align-items: center; justify-content: center; background: {{accent}}; color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 500\">{{sendLabel}}<\/a>\n            <a href=\"WorkflowRun.dc.html\" style=\"height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #b8b8b2; text-decoration: none; font-size: 14px\">Back to the draft<\/a>\n          <\/section>\n          <section aria-labelledby=\"srdiff\" style=\"border: 1px solid #dcdcd8; padding: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; line-height: 1.5\">\n            <h2 id=\"srdiff\" style=\"margin: 0; font-size: 15px; font-weight: 600\">The difference<\/h2>\n            <span><span style=\"font-weight: 600\">Attorney review<\/span> stays in your firm. Your attorney approves, edits or sends it back.<\/span>\n            <span><span style=\"font-weight: 600\">LawCompany review<\/span> goes to our team. We QC it or finish it, then send it to your review page for approval.<\/span>\n          <\/section>\n        <\/div>\n      <\/sc-if>\n      <sc-if value=\"{{railClosed}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 14px\">\n          <button type=\"button\" onClick=\"{{toggleRail}}\" aria-label=\"Expand actions panel\" aria-expanded=\"false\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #b8b8b2; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"><\/path><\/svg><\/button>\n          <span role=\"img\" aria-label=\"1 next action\" style=\"min-width: 28px; height: 28px; padding: 0 6px; box-sizing: border-box; border-radius: 14px; background: #1c1c1a; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">1<\/span>\n          <span style=\"writing-mode: vertical-rl; font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #4a4a46\">Next action<\/span>\n        <\/div>\n      <\/sc-if>\n    <\/aside>\n  <\/main>\n<\/div>",
    Logic: (function () {
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { who: 'lc', kind: 'qc' };
  }
  renderVals() {
    var self = this;
    var railOpen = !this.state.railClosed;
    var who = this.state.who;
    var card = 'display: flex; flex-direction: column; gap: 8px; padding: 18px; background: #ffffff; font-family: inherit; text-align: left; color: #1c1c1a; cursor: pointer; ';
    var dot = function (on) { return 'flex: none; width: 16px; height: 16px; border-radius: 50%; box-sizing: border-box; ' + (on ? 'border: 5px solid #1c1c1a' : 'border: 1.5px solid #5c5c58'); };
    var opts = [
      { id: 'firm', title: 'Attorney review', desc: 'Keep it in your firm. An attorney at your firm reviews and approves it.', meta: 'No LawCompany hours' },
      { id: 'lc', title: 'LawCompany review', desc: 'Hand it to LawCompany to QC your draft or finish the workflow for you.', meta: 'Quick review · up to 2.0 hrs' }
    ];
    var kinds = [
      { id: 'qc', title: 'QC my draft', desc: 'Check accuracy, citations and tone; fix what is wrong.' },
      { id: 'finish', title: 'Finish this workflow', desc: 'Complete the draft and any remaining steps for you.' },
      { id: 'answer', title: 'Check an AI answer', desc: 'Confirm a research or chat answer before you rely on it.' }
    ];
    var kbtn = 'display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; background: #ffffff; font-family: inherit; font-size: 14px; color: #1c1c1a; cursor: pointer; ';
    var isLc = who === 'lc';
    return {
      railOpen: railOpen,
      railClosed: !railOpen,
      railStyle: 'flex: 0 0 ' + (railOpen ? '340px; width: 340px' : '44px; width: 44px') + '; min-width: 0; position: sticky; top: 24px',
      toggleRail: function () { self.setState({ railClosed: railOpen }); },
      accent: this.props.accent ?? '#1c1c1a',
      isLc: isLc, isFirm: !isLc,
      whoOptions: opts.map(function (o) {
        var on = o.id === who;
        return Object.assign({}, o, { checked: on ? 'true' : 'false', pick: function () { self.setState({ who: o.id }); },
          style: card + (on ? 'border: 2px solid #1c1c1a' : 'border: 1px solid #b8b8b2; margin: 1px'), dot: dot(on) });
      }),
      kinds: kinds.map(function (k) {
        var on = k.id === self.state.kind;
        return Object.assign({}, k, { checked: on ? 'true' : 'false', pick: function () { self.setState({ kind: k.id }); },
          style: kbtn + (on ? 'border: 2px solid #1c1c1a' : 'border: 1px solid #b8b8b2; margin: 1px'), dot: dot(on) });
      }),
      sendLabel: isLc ? 'Send to LawCompany review' : 'Send to attorney review',
      sendHref: isLc ? 'Projects.dc.html' : 'Review.dc.html',
      nextText: isLc ? 'It goes straight to the LawCompany team, with no estimate needed. You can track it under Projects.' : 'It goes to the attorney’s review queue in your firm.'
    };
  }
}

    return Component; })()
  },

b8b8b2; text-align: center; font-size: 14px; color: #4a4a46\">Nothing matches this filter. Choose \"All waiting\" to see every client.<\/div>\n      <\/sc-if>\n      <p style=\"margin: 0; font-size: 13px; color: #5c5c58\">Deploy is available only after QC passes. Drafts deploy to the client review page; finals deploy to the project page and the matter folder.<\/p>\n    <\/div>\n\n    <aside aria-label=\"Actions\" style=\"{{railStyle}}\">\n      <sc-if value=\"{{railOpen}}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 20px\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between\">\n            <span style=\"font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #4a4a46\">Actions<\/span>\n            <button type=\"button\" onClick=\"{{toggleRail}}\" aria-label=\"Collapse actions panel\" aria-expanded=\"true\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #b8b8b2; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg><\/button>\n          <\/div>\n\n          <sc-if value=\"{{showApproval}}\" hint-placeholder-val=\"{{ false }}\">\n            <section aria-labelledby=\"qapp\" style=\"border: 1px solid #1d4f91; background: #f2f6fc; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n              <h2 id=\"qapp\" style=\"margin: 0; font-size: 16px; font-weight: 600; color: #1d4f91\">Attorney approval: deploy<\/h2>\n              <span style=\"font-size: 14px; font-weight: 500\">{{sel.title}}<\/span>\n              <span style=\"font-size: 13px; color: #2e2e2b\">To {{sel.firm}} · {{sel.destination}}<\/span>\n              <div style=\"display: flex; flex-direction: column; gap: 6px; font-size: 13px\">\n                <sc-for list=\"{{sel.checks}}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <span style=\"display: flex; gap: 8px; align-items: center\"><span aria-hidden=\"true\" style=\"width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; background: #1d4f91; color: #ffffff; font-size: 12px\">✓<\/span>{{c}}<\/span>\n                <\/sc-for>\n              <\/div>\n              <button type=\"button\" onClick=\"{{confirmDeploy}}\" style=\"height: 44px; background: #1d4f91; color: #ffffff; border: none; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer\">{{sel.deployLabel}}<\/button>\n              <button type=\"button\" onClick=\"{{cancelDeploy}}\" style=\"height: 40px; background: #ffffff; border: 1px solid #1d4f91; color: #1d4f91; font-family: inherit; font-size: 14px; cursor: pointer\">Cancel<\/button>\n              <span style=\"font-size: 12px; color: #4a4a46\">The client is notified by email and sees it on their Projects page.<\/span>\n            <\/section>\n          <\/sc-if>\n\n          <sc-if value=\"{{showNext}}\" hint-placeholder-val=\"{{ true }}\">\n            <section aria-labelledby=\"qnext\" style=\"border: 1px solid #1c1c1a; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n              <h2 id=\"qnext\" style=\"margin: 0; font-size: 16px; font-weight: 600\">Next action<\/h2>\n              <p style=\"margin: 0; font-size: 13px; line-height: 1.5; color: #4a4a46\">{{nextText}}<\/p>\n              <button type=\"button\" onClick=\"{{nextDo}}\" style=\"height: 44px; background: #1c1c1a; color: #ffffff; border: none; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer\">{{nextLabel}}<\/button>\n            <\/section>\n          <\/sc-if>\n\n          <section aria-labelledby=\"qsel\" style=\"border: 1px solid #dcdcd8; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n            <h2 id=\"qsel\" style=\"margin: 0; font-size: 15px; font-weight: 600\">Selected<\/h2>\n            <span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; font-weight: 500\">{{sel.title}}<\/span><span style=\"font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: #5c5c58\">{{sel.num}} · {{sel.firm}}<\/span><\/span>\n            <dl style=\"margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px\">\n              <dt style=\"color: #5c5c58\">Waiting for<\/dt><dd style=\"margin: 0\">{{sel.waiting}}<\/dd>\n              <dt style=\"color: #5c5c58\">Stage<\/dt><dd style=\"margin: 0\">{{sel.stage}}<\/dd>\n              <dt style=\"color: #5c5c58\">Assignee<\/dt><dd style=\"margin: 0\">{{sel.assignee}}<\/dd>\n              <dt style=\"color: #5c5c58\">QC attorney<\/dt><dd style=\"margin: 0\">{{sel.qc}}<\/dd>\n              <dt style=\"color: #5c5c58\">Hours<\/dt><dd style=\"margin: 0; font-family: 'IBM Plex Mono', monospace\">{{sel.hours}}<\/dd>\n            <\/dl>\n            <a href=\"{{sel.reviewHref}}\" style=\"font-size: 13px\">Open the full workspace<\/a>\n          <\/section>\n\n          <section aria-labelledby=\"qhow\" style=\"border: 1px solid #dcdcd8; padding: 16px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.5; color: #4a4a46\">\n            <h2 id=\"qhow\" style=\"margin: 0; font-size: 15px; font-weight: 600; color: #1c1c1a\">Review · Use tools · Deploy<\/h2>\n            <span><b style=\"color: #1c1c1a\">Review<\/b> opens the work: QC for drafts, intake for new requests, the project workspace for everything else.<\/span>\n            <span><b style=\"color: #1c1c1a\">Use tools<\/b> runs workflows, chat and the firm's library inside that client's matter.<\/span>\n            <span><b style=\"color: #1c1c1a\">Deploy<\/b> sends QC-passed work to the client.<\/span>\n          <\/section>\n        <\/div>\n      <\/sc-if>\n      <sc-if value=\"{{railClosed}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 14px\">\n          <button type=\"button\" onClick=\"{{toggleRail}}\" aria-label=\"Expand actions panel\" aria-expanded=\"false\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #b8b8b2; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"><\/path><\/svg><\/button>\n          <span role=\"img\" aria-label=\"{{readyCount}} ready to deploy\" style=\"min-width: 28px; height: 28px; padding: 0 6px; box-sizing: border-box; border-radius: 14px; background: #1c1c1a; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">{{readyCount}}<\/span>\n          <span style=\"writing-mode: vertical-rl; font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #4a4a46\">Next action<\/span>\n        <\/div>\n      <\/sc-if>\n    <\/aside>\n  <\/main>\n<\/div>",
    Logic: (function () {
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var st = this.state || {};
    var railOpen = !st.railClosed;
    var filter = st.filter || 'all';
    var deployed = st.deployed || {};
    var tools = st.tools || null;
    var confirming = st.confirming || null;

    var FIRMS = [
      { id: 'A', name: '[Client Firm A]', plan: 'Subscription · 40 hrs', meta: '18.5 hrs left this month · contact [Partner Name]' },
      { id: 'B', name: '[Client Firm B]', plan: 'Subscription · 20 hrs', meta: '9.0 hrs left · estimate pending on 1 project' },
      { id: 'C', name: '[Client Firm C]', plan: 'Subscription · 60 hrs', meta: '7.5 hrs left · near plan limit' },
      { id: 'D', name: '[Client Firm D]', plan: 'Project-based', meta: 'Billed on delivery · contact [Partner Name]' }
    ];
    var ITEMS = [
      { id: 'i1', firm: 'A', title: 'Notice of breach draft', num: 'R-2026-0051', kind: 'LawCompany review', waiting: 'QC’d draft back', stage: 'In QC', state: 'review', due: 'Due Oct 30', age: 'Waiting 2 days', reviewHref: 'QC.dc.html', assignee: '[Associate Name]', qc: '[Partner Name]', hours: '1.2 of 2.0 cap' },
      { id: 'i2', firm: 'A', title: 'Okafor deposition outline', num: 'P-2026-0241', kind: 'Full project', waiting: 'An estimate', stage: 'New · not assigned', state: 'review', due: 'Due Nov 6', age: 'Waiting 6 hrs', reviewHref: 'TeamIntake.dc.html', assignee: 'Not assigned', qc: 'Not assigned', hours: 'No estimate yet' },
      { id: 'i3', firm: 'B', title: 'Supply agreement redline v2', num: 'P-2026-0236', kind: 'Full project', waiting: 'Revised redline', stage: 'In progress · client comments', state: 'work', due: 'Due Oct 28', age: 'Waiting 1 day', reviewHref: 'TeamProject.dc.html', assignee: '[Associate Name]', qc: '[Senior Associate]', hours: '6.5 of 10.0 est.' },
      { id: 'i4', firm: 'B', title: 'Lien notice, final', num: 'P-2026-0230', kind: 'Full project', waiting: 'Final release', stage: 'Release check passed', state: 'ready', release: true, due: 'Due Oct 27', age: 'Ready 3 hrs', reviewHref: 'QC.dc.html', assignee: '[Paralegal Name]', qc: '[Partner Name]', hours: '3.5 of 4.0 est.' },
      { id: 'i5', firm: 'C', title: 'Employee handbook update', num: 'P-2026-0228', kind: 'Full project', waiting: 'First draft to review', stage: 'QC passed', state: 'ready', release: false, due: 'Due Oct 29', age: 'Ready 1 hr', reviewHref: 'QC.dc.html', assignee: '[Associate Name]', qc: '[Senior Associate]', hours: '8.0 of 9.5 est.' },
      { id: 'i6', firm: 'C', title: 'Check an AI answer: non-compete enforceability', num: 'R-2026-0055', kind: 'LawCompany review', waiting: 'A checked answer', stage: 'In progress', state: 'work', due: 'Due Oct 27', age: 'Waiting 5 hrs', reviewHref: 'TeamProject.dc.html', assignee: '[Associate Name]', qc: '[Partner Name]', hours: '0.4 of 2.0 cap' },
      { id: 'i7', firm: 'D', title: 'Privilege log, 4,200 documents', num: 'P-2026-0233', kind: 'Full project', waiting: 'Revised log', stage: 'In progress · returned by QC', state: 'work', due: 'Due Nov 14', age: 'Waiting 1 day', reviewHref: 'TeamProject.dc.html', assignee: '[Associate Name]', qc: '[Partner Name]', hours: '10.0 of 14.0 est.' }
    ];
    var firmName = {}; FIRMS.forEach(function (f) { firmName[f.id] = f.name; });

    var isReady = function (it) { return it.state === 'ready' && !deployed[it.id]; };
    var open = ITEMS.filter(function (it) { return !deployed[it.id]; });
    var counts = {
      all: open.length,
      review: open.filter(function (it) { return it.state === 'review'; }).length,
      work: open.filter(function (it) { return it.state === 'work'; }).length,
      ready: open.filter(function (it) { return it.state === 'ready'; }).length
    };
    var match = function (it) { return !deployed[it.id] && (filter === 'all' || it.state === filter); };

    var selId = st.sel || 'i4';
    var selItem = ITEMS.filter(function (it) { return it.id === selId; })[0] || ITEMS[0];

    var startDeploy = function (id) { self.setState({ sel: id, confirming: id, railClosed: false }); };

    var toolsFor = function (it) {
      var base = [
        { label: 'Run a workflow', sub: 'Skills chained for this task', href: 'WorkflowRun.dc.html' },
        { label: 'Ask Chat', sub: 'Scoped to this matter', href: 'Chat.dc.html' },
        { label: 'Firm library', sub: firmName[it.firm] + ' voice and rules', href: 'Library.dc.html' },
        { label: 'Project workspace', sub: 'Files, time log, versions', href: 'TeamProject.dc.html' }
      ];
      return base;
    };

    var stageStyle = {
      review: 'align-self: flex-start; font-size: 12px; padding: 2px 8px; background: #f2f6fc; color: #1d4f91',
      work: 'align-self: flex-start; font-size: 12px; padding: 2px 8px; background: #f0f0ec; color: #2e2e2b',
      ready: 'align-self: flex-start; font-size: 12px; padding: 2px 8px; background: #eef6f0; color: #1f5a32; font-weight: 500'
    };
    var depOn = 'height: 36px; padding: 0 12px; border: none; background: #1d4f91; color: #ffffff; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer';
    var depOff = 'height: 36px; padding: 0 12px; border: 1px solid #dcdcd8; background: #f5f5f3; color: #8a8a84; font-family: inherit; font-size: 13px; cursor: not-allowed';

    var groups = FIRMS.map(function (f) {
      var items = ITEMS.filter(function (it) { return it.firm === f.id && match(it); }).map(function (it) {
        var ready = isReady(it);
        return Object.assign({}, it, {
          selected: it.id === selId ? 'true' : 'false',
          wrapStyle: 'border-top: 1px solid #e3e3df; ' + (it.id === selId ? 'box-shadow: inset 3px 0 0 #1c1c1a; background: #fcfcfb' : ''),
          stageStyle: stageStyle[it.state],
          pick: function () { self.setState({ sel: it.id }); },
          toolsOpen: tools === it.id,
          tools: toolsFor(it),
          toggleTools: function () { self.setState({ tools: tools === it.id ? null : it.id, sel: it.id }); },
          deploy: function () { if (ready) startDeploy(it.id); },
          deployDisabled: !ready,
          deployHint: ready ? '' : 'Available after QC passes',
          deployStyle: ready ? depOn : depOff,
          deployLabel: it.release ? 'Release final' : 'Deploy to client'
        });
      });
      return { name: f.name, plan: f.plan, meta: f.meta, items: items, has: items.length > 0 };
    }).filter(function (g) { return g.has; });

    var tileBase = 'all: unset; cursor: pointer; box-sizing: border-box; border: 1px solid #dcdcd8; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; ';
    var tiles = [
      { key: 'all', label: 'Waiting on LawCompany', value: counts.all, sub: 'across ' + groupsCount(open) + ' client firms' },
      { key: 'review', label: 'Needs review', value: counts.review, sub: 'new requests and QC' },
      { key: 'work', label: 'In progress', value: counts.work, sub: 'use tools to finish' },
      { key: 'ready', label: 'Ready to deploy', value: counts.ready, sub: 'QC passed' }
    ].map(function (t) {
      var on = filter === t.key;
      return Object.assign({}, t, {
        pressed: on ? 'true' : 'false',
        style: tileBase + (on ? 'border: 2px solid #1c1c1a; padding: 13px 15px; background: #fafaf8' : 'background: #ffffff'),
        pick: function () { self.setState({ filter: t.key }); }
      });
    });
    function groupsCount(list) { var s = {}; list.forEach(function (it) { s[it.firm] = 1; }); return Object.keys(s).length; }

    var chip = 'height: 34px; padding: 0 12px; font-family: inherit; font-size: 13px; cursor: pointer; ';
    var filters = [
      { key: 'all', label: 'All waiting (' + counts.all + ')' },
      { key: 'review', label: 'Needs review (' + counts.review + ')' },
      { key: 'work', label: 'In progress (' + counts.work + ')' },
      { key: 'ready', label: 'Ready to deploy (' + counts.ready + ')' }
    ].map(function (f) {
      var on = filter === f.key;
      return Object.assign({}, f, {
        pressed: on ? 'true' : 'false',
        style: chip + (on ? 'background: #1c1c1a; color: #ffffff; border: 1px solid #1c1c1a' : 'background: #ffffff; color: #1c1c1a; border: 1px solid #b8b8b2'),
        pick: function () { self.setState({ filter: f.key }); }
      });
    });

    var confItem = confirming ? ITEMS.filter(function (it) { return it.id === confirming; })[0] : null;
    var showApproval = !!(confItem && !deployed[confItem.id]);
    var selReady = isReady(selItem);
    var firstReady = open.filter(function (it) { return it.state === 'ready'; })[0];

    var nextText, nextLabel, nextDo;
    if (selReady) {
      nextText = selItem.title + ' passed QC. ' + firmName[selItem.firm] + ' is waiting for ' + selItem.waiting.toLowerCase() + '.';
      nextLabel = selItem.release ? 'Release final to client' : 'Deploy to client review';
      nextDo = function () { startDeploy(selItem.id); };
    } else if (firstReady) {
      nextText = counts.ready + ' item' + (counts.ready === 1 ? ' is' : 's are') + ' ready to deploy. Start with ' + firstReady.title + ' for ' + firmName[firstReady.firm] + '.';
      nextLabel = 'Deploy ' + firstReady.num;
      nextDo = function () { startDeploy(firstReady.id); };
    } else {
      nextText = 'Nothing is ready to deploy. ' + counts.review + ' item' + (counts.review === 1 ? ' needs' : 's need') + ' review.';
      nextLabel = 'Show items to review';
      nextDo = function () { self.setState({ filter: 'review' }); };
    }

    var last = st.last || null;
    var lastItem = last ? ITEMS.filter(function (it) { return it.id === last; })[0] : null;

    var sel = Object.assign({}, selItem, {
      firm: firmName[selItem.firm],
      stage: deployed[selItem.id] ? 'Deployed to client' : selItem.stage,
      destination: selItem.release ? 'project page + matter folder' : 'client review page',
      deployLabel: selItem.release ? 'Release final to ' + firmName[selItem.firm] : 'Deploy to ' + firmName[selItem.firm],
      checks: selItem.release ? ['Client approved the reviewed draft', 'Release check (QC) passed', 'Hours logged: ' + selItem.hours] : ['QC passed: 5 of 5 checks', 'Deliverable matches the approved scope', 'Hours logged: ' + selItem.hours]
    });
    if (confItem) {
      sel = Object.assign({}, sel, {
        title: confItem.title,
        firm: firmName[confItem.firm],
        destination: confItem.release ? 'project page + matter folder' : 'client review page',
        deployLabel: confItem.release ? 'Release final to ' + firmName[confItem.firm] : 'Deploy to ' + firmName[confItem.firm]
      });
    }

    return {
      summary: counts.all + ' items across ' + groupsCount(open) + ' client firms are waiting on LawCompany. ' + counts.ready + ' ' + (counts.ready === 1 ? 'is' : 'are') + ' ready to deploy.',
      tiles: tiles,
      filters: filters,
      groups: groups,
      empty: groups.length === 0,
      readyCount: counts.ready,
      sel: sel,
      showApproval: showApproval,
      showNext: !showApproval,
      nextText: nextText, nextLabel: nextLabel, nextDo: nextDo,
      confirmDeploy: function () {
        if (!confItem) return;
        var d = Object.assign({}, deployed); d[confItem.id] = true;
        self.setState({ deployed: d, confirming: null, last: confItem.id, tools: null });
      },
      cancelDeploy: function () { self.setState({ confirming: null }); },
      hasBanner: !!(lastItem && deployed[lastItem.id]),
      banner: lastItem ? (lastItem.release ? 'Released ' + lastItem.title + ' to ' + firmName[lastItem.firm] + '. It is on their project page and in the matter folder.' : 'Deployed ' + lastItem.title + ' to ' + firmName[lastItem.firm] + '’s client review page. They have been notified.') : '',
      undo: function () { if (!lastItem) return; var d = Object.assign({}, deployed); delete d[lastItem.id]; self.setState({ deployed: d, last: null }); },
      railOpen: railOpen,
      railClosed: !railOpen,
      railStyle: 'flex: 0 0 ' + (railOpen ? '340px; width: 340px' : '44px; width: 44px') + '; min-width: 0; position: sticky; top: 24px',
      toggleRail: function () { self.setState({ railClosed: railOpen }); }
    };
  }
}

    return Component; })()
  },

    syncNav();
  }
  function routeFromHash() {
    var h = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
    go(SCREENS[h] ? h : START);
  }

  ['click', 'input', 'change', 'keydown', 'submit'].forEach(function (type) {
    app.addEventListener(type, function (ev) {
      if (type === 'input' && ev.target.id) {
        (typed[current] = typed[current] || {})[ev.target.id] = ev.target.value;
      }
      if (type === 'submit') ev.preventDefault();
      var el = ev.target.closest && ev.target.closest('[data-on-' + type + ']');
      if (el && app.contains(el)) {
        var fn = handlers[+el.getAttribute('data-on-' + type)];
        if (fn) fn(ev);
      }
      if (type !== 'click' || ev.defaultPrevented) return;
      var a = ev.target.closest('a[href]');
      if (!a) return;
      var href = a.getAttribute('href');
      if (/\.dc\.html$/.test(href)) {
        ev.preventDefault();
        var name = href.split('/').pop().replace('.dc.html', '');
        if (name === current) window.scrollTo(0, 0);
        else location.hash = '#/' + name;
      } else if (href === '#') {
        ev.preventDefault();
      } else if (href[0] === '#') {
        ev.preventDefault();
        var t = document.getElementById(href.slice(1));
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else if (/^https?:/.test(href)) {
        a.target = '_blank';
        a.rel = 'noopener';
      }
    });
  });
  window.addEventListener('hashchange', routeFromHash);

  /* Screen navigator */
  var list = document.getElementById('lcp-list');
  var toggle = document.getElementById('lcp-toggle');
  var html = '';
  GROUPS.forEach(function (g) {
    html += '<div class="grp">' + escHtml(g[0]) + '</div>';
    g[1].forEach(function (n) {
      if (!SCREENS[n]) return;
      html += '<button type="button" data-go="' + n + '"><span class="num">' + String(ORDER.indexOf(n) + 1).padStart(2, '0') + '</span>' + escHtml(SCREENS[n].title.replace(/^WF \d+\s*/, '')) + '</button>';
    });
  });
  list.innerHTML = html;
  function setOpen(open) {
    list.hidden = !open;
    toggle.setAttribute('aria-expanded', String(open));
    if (open) { var c = list.querySelector('[aria-current]'); if (c) c.scrollIntoView({ block: 'nearest' }); }
  }
  toggle.addEventListener('click', function () { setOpen(list.hidden); });
  list.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-go]');
    if (b) { location.hash = '#/' + b.getAttribute('data-go'); setOpen(false); }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !list.hidden) { setOpen(false); toggle.focus(); } });
  document.addEventListener('click', function (ev) { if (!list.hidden && !ev.target.closest('#lcp-nav')) setOpen(false); });
  function step(d) { location.hash = '#/' + ORDER[(ORDER.indexOf(current) + d + ORDER.length) % ORDER.length]; }
  document.getElementById('lcp-prev').addEventListener('click', function () { step(-1); });
  document.getElementById('lcp-next').addEventListener('click', function () { step(1); });

  var acc = document.getElementById('lcp-acc');
  acc.innerHTML = ACCENTS.map(function (c) {
    return '<button type="button" class="sw" data-accent="' + c + '" aria-label="Accent ' + c + '" style="background:' + c + '"></button>';
  }).join('');
  acc.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-accent]');
    if (!b) return;
    accent = b.getAttribute('data-accent');
    try { localStorage.setItem('lcp-accent', accent); } catch (e) {}
    paint();
    syncNav();
  });

  function syncNav() {
    document.getElementById('lcp-num').textContent = String(ORDER.indexOf(current) + 1).padStart(2, '0') + '/' + ORDER.length;
    document.getElementById('lcp-cur').textContent = SCREENS[current].title.replace(/^WF \d+\s*/, '');
    list.querySelectorAll('[data-go]').forEach(function (b) {
      if (b.getAttribute('data-go') === current) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    acc.querySelectorAll('[data-accent]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-accent') === accent)); });
    acc.style.opacity = SCREENS[current].props.accent ? '' : '.35';
  }

  routeFromHash();
})();
</script>
</body>
</html>
