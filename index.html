@media print { #lcp-nav { display: none; } }

z\"><\/path><path d=\"M20 4h-5a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h6z\"><\/path><\/svg>Library<\/a>\n      <a href=\"Connectors.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5\"><\/path><\/svg>Connectors<\/a>\n      <div style=\"margin: 14px 12px 4px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #5c5c58\">Firm admin<\/div>\n      <a href=\"Reports.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\/path><\/svg>Reports<\/a>\n      <a href=\"Admin.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z\"><\/path><path d=\"M9 12l2 2 4-4\"><\/path><\/svg>Admin dashboard<\/a>\n    <\/div>\n    <div style=\"margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-top: 1px solid #dcdcd8\">\n      <div style=\"width: 36px; height: 36px; border-radius: 50%; background: #dcdcd8; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">JD<\/div>\n      <div style=\"display: flex; flex-direction: column; font-size: 13px; line-height: 1.35\">\n        <span style=\"font-weight: 500\">[Attorney Name]<\/span>\n        <span style=\"color: #5c5c58\">[Firm / Client]<\/span>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n\n    <header style=\"padding: 28px 40px 0; border-bottom: 1px solid #dcdcd8; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"font-size: 13px; color: #5c5c58\"><a href=\"Home.dc.html\">Home<\/a> / <a href=\"Matters.dc.html\">Matters<\/a> / Acme Holdings v. Delta Supply<\/div>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px\">\n          <h1 style=\"margin: 0; font-size: 30px; font-weight: 600\">Acme Holdings v. Delta Supply<\/h1>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; color: #4a4a46\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace\">M-2026-0142<\/span>\n            <span aria-hidden=\"true\">·<\/span>\n            <span>Commercial litigation<\/span>\n            <span style=\"padding: 3px 10px; border: 1px solid #b8b8b2; font-size: 12px\">Discovery<\/span>\n          <\/div>\n        <\/div>\n        <div style=\"display: flex; gap: 10px\">\n          <button type=\"button\" style=\"height: 44px; padding: 0 16px; background: #ffffff; border: 1px solid #b8b8b2; font-family: inherit; font-size: 14px; cursor: pointer\">Upload documents<\/button>\n          <a href=\"Submit.dc.html\" style=\"height: 44px; padding: 0 16px; display: flex; align-items: center; box-sizing: border-box; background: #ffffff; border: 1px solid #1c1c1a; text-decoration: none; font-size: 14px\">Hand off to LawCompany<\/a>\n          <a href=\"Workflows.dc.html\" style=\"height: 44px; padding: 0 18px; display: flex; align-items: center; background: {{accent}}; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 500\">Start workflow<\/a>\n        <\/div>\n      <\/div>\n      <div role=\"tablist\" aria-label=\"Matter tools\" style=\"display: flex; gap: 2px; overflow-x: auto\">\n        <sc-for list=\"{{tabs}}\" as=\"t\" hint-placeholder-count=\"7\">\n          <button type=\"button\" role=\"tab\" class=\"tab\" aria-selected=\"{{t.selected}}\" onClick=\"{{t.pick}}\" style=\"{{t.style}}\">{{t.label}}<\/button>\n        <\/sc-for>\n        <button type=\"button\" class=\"tab\" style=\"height: 44px; padding: 0 16px; background: transparent; border: none; border-bottom: 2px solid transparent; font-family: inherit; font-size: 14px; color: #5c5c58; cursor: pointer; white-space: nowrap\">+ Add tool<\/button>\n      <\/div>\n    <\/header>\n\n    <div style=\"display: flex; flex-wrap: nowrap; align-items: flex-start; gap: 32px; padding: 32px 40px 64px; box-sizing: border-box\">\n\n      <main style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n\n        <form style=\"display: flex; gap: 10px; align-items: center; border: 1px solid #1c1c1a; padding: 10px 10px 10px 16px\">\n          <label for=\"mask\" style=\"font-size: 14px; font-weight: 500; white-space: nowrap\">Ask about this matter<\/label>\n          <input id=\"mask\" type=\"text\" placeholder=\"e.g. What did Alvarez say about the June invoices?\" style=\"flex: 1; min-width: 0; height: 40px; border: none; border-left: 1px solid #dcdcd8; padding: 0 12px; font-family: inherit; font-size: 14px\">\n          <a href=\"Chat.dc.html\" style=\"height: 40px; padding: 0 18px; display: flex; align-items: center; background: {{accent}}; color: #ffffff; text-decoration: none; font-size: 14px\">Ask<\/a>\n        <\/form>\n\n        <sc-if value=\"{{isOverview}}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 24px\">\n\n            <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px\">\n              <section aria-labelledby=\"mi\" style=\"border: 1px solid #dcdcd8; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n                <h2 id=\"mi\" style=\"margin: 0; font-size: 16px; font-weight: 600\">Matter<\/h2>\n                <dl style=\"margin: 0; display: grid; grid-template-columns: 140px 1fr; row-gap: 10px; column-gap: 12px; font-size: 14px\">\n                  <dt style=\"color: #5c5c58\">Client<\/dt><dd style=\"margin: 0\">Acme Holdings, LLC<\/dd>\n                  <dt style=\"color: #5c5c58\">Type<\/dt><dd style=\"margin: 0\">Breach of contract<\/dd>\n                  <dt style=\"color: #5c5c58\">Opened<\/dt><dd style=\"margin: 0\">Mar 3, 2026<\/dd>\n                  <dt style=\"color: #5c5c58\">Lead attorney<\/dt><dd style=\"margin: 0\">[Attorney Name]<\/dd>\n                  <dt style=\"color: #5c5c58\">Next deadline<\/dt><dd style=\"margin: 0; font-weight: 500\">Nov 6: discovery responses due<\/dd>\n                  <dt style=\"color: #5c5c58\">Hours this month<\/dt><dd style=\"margin: 0; font-family: 'IBM Plex Mono', monospace\">9.5 hrs<\/dd>\n                <\/dl>\n              <\/section>\n              <section aria-labelledby=\"ju\" style=\"border: 1px solid #dcdcd8; padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n                <h2 id=\"ju\" style=\"margin: 0; font-size: 16px; font-weight: 600\">Jurisdiction &amp; court<\/h2>\n                <dl style=\"margin: 0; display: grid; grid-template-columns: 140px 1fr; row-gap: 10px; column-gap: 12px; font-size: 14px\">\n                  <dt style=\"color: #5c5c58\">Court<\/dt><dd style=\"margin: 0\">Circuit Court of Cook County<\/dd>\n                  <dt style=\"color: #5c5c58\">Division<\/dt><dd style=\"margin: 0\">Law Division, Commercial Calendar<\/dd>\n                  <dt style=\"color: #5c5c58\">Case no.<\/dt><dd style=\"margin: 0; font-family: 'IBM Plex Mono', monospace\">[2026 L 000000]<\/dd>\n                  <dt style=\"color: #5c5c58\">Judge<\/dt><dd style=\"margin: 0\">[Judge Name]<\/dd>\n                  <dt style=\"color: #5c5c58\">Governing law<\/dt><dd style=\"margin: 0\">Illinois<\/dd>\n                  <dt style=\"color: #5c5c58\">Standing order<\/dt><dd style=\"margin: 0\"><a href=\"#\">View<\/a><\/dd>\n                <\/dl>\n              <\/section>\n            <\/div>\n\n            <section aria-labelledby=\"pa\" style=\"border: 1px solid #dcdcd8; display: flex; flex-direction: column\">\n              <div style=\"padding: 16px 20px; display: flex; justify-content: space-between; align-items: baseline\">\n                <h2 id=\"pa\" style=\"margin: 0; font-size: 16px; font-weight: 600\">Parties<\/h2>\n                <a href=\"#\" style=\"font-size: 13px\">Edit parties<\/a>\n              <\/div>\n              <div style=\"overflow-x: auto\">\n                <div style=\"min-width: 560px\">\n                  <div style=\"display: grid; grid-template-columns: 1fr 1.4fr 1.6fr; gap: 16px; padding: 10px 20px; background: #f5f5f3; font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; color: #5c5c58\">\n                    <span>Role<\/span><span>Party<\/span><span>Counsel<\/span>\n                  <\/div>\n                  <sc-for list=\"{{parties}}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <div style=\"display: grid; grid-template-columns: 1fr 1.4fr 1.6fr; gap: 16px; padding: 12px 20px; border-top: 1px solid #dcdcd8; font-size: 14px\">\n                      <span style=\"color: #4a4a46\">{{p.role}}<\/span><span style=\"font-weight: 500\">{{p.name}}<\/span><span>{{p.counsel}}<\/span>\n                    <\/div>\n                  <\/sc-for>\n                <\/div>\n              <\/div>\n            <\/section>\n\n            <section aria-labelledby=\"mproj\" style=\"display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n                <h2 id=\"mproj\" style=\"margin: 0; font-size: 16px; font-weight: 600\">Projects with LawCompany<\/h2>\n                <a href=\"Submit.dc.html\" style=\"font-size: 13px\">+ Hand off work<\/a>\n              <\/div>\n              <div style=\"border: 1px solid #dcdcd8\">\n                <a href=\"ProjectDetail.dc.html\" class=\"folder\" style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #dcdcd8; text-decoration: none\">\n                  <span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; font-weight: 500\">Privilege review, production vol. 4<\/span><span style=\"font-size: 12px; color: #5c5c58\"><span style=\"font-family: 'IBM Plex Mono', monospace\">P-2026-0233<\/span> · 9 of 12 est. hrs · due Nov 3<\/span><\/span>\n                  <span style=\"padding: 4px 10px; font-size: 12px; border: 1px solid #b8b8b2\">In progress<\/span>\n                <\/a>\n                <a href=\"ProjectDetail.dc.html\" class=\"folder\" style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 14px 18px; text-decoration: none\">\n                  <span style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; font-weight: 500\">Okafor deposition outline<\/span><span style=\"font-size: 12px; color: #5c5c58\"><span style=\"font-family: 'IBM Plex Mono', monospace\">P-2026-0239<\/span> · estimate pending · due Nov 10<\/span><\/span>\n                  <span style=\"padding: 4px 10px; font-size: 12px; border: 1px solid #b8b8b2\">Submitted<\/span>\n                <\/a>\n              <\/div>\n            <\/section>\n\n            <section aria-labelledby=\"fo\" style=\"display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n                <h2 id=\"fo\" style=\"margin: 0; font-size: 16px; font-weight: 600\">Output folders<\/h2>\n                <a href=\"#\" style=\"font-size: 13px\">New folder<\/a>\n              <\/div>\n              <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px\">\n                <sc-for list=\"{{folders}}\" as=\"f\" hint-placeholder-count=\"6\">\n                  <a href=\"Output.dc.html\" class=\"folder\" style=\"border: 1px solid #dcdcd8; padding: 16px; display: flex; gap: 14px; align-items: center; text-decoration: none\">\n                    <svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"1.5\" aria-hidden=\"true\"><path d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"><\/path><\/svg>\n                    <span style=\"display: flex; flex-direction: column; gap: 2px\">\n                      <span style=\"font-size: 14px; font-weight: 500\">{{f.name}}<\/span>\n                      <span style=\"font-size: 12px; color: #5c5c58\">{{f.count}} files · updated {{f.when}}<\/span>\n                    <\/span>\n                  <\/a>\n                <\/sc-for>\n              <\/div>\n            <\/section>\n\n          <\/div>\n        <\/sc-if>\n\n        <sc-if value=\"{{isTool}}\" hint-placeholder-val=\"{{ false }}\">\n          <section aria-labelledby=\"tooltitle\" style=\"border: 1px solid #dcdcd8; padding: 28px; display: flex; flex-direction: column; gap: 20px\">\n            <div style=\"display: flex; flex-direction: column; gap: 6px\">\n              <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #5c5c58\">Tool · runs inside this matter<\/div>\n              <h2 id=\"tooltitle\" style=\"margin: 0; font-size: 22px; font-weight: 600\">{{toolName}}<\/h2>\n              <p style=\"margin: 0; font-size: 15px; color: #4a4a46; line-height: 1.5\">{{toolBlurb}}<\/p>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <label for=\"src\" style=\"font-size: 14px; font-weight: 500\">Source documents from this matter<\/label>\n              <select id=\"src\" style=\"height: 44px; border: 1px solid #b8b8b2; padding: 0 10px; font-family: inherit; font-size: 14px; background: #ffffff\">\n                <option>Discovery / Alvarez deposition transcript (Oct 12).pdf<\/option>\n                <option>Pleadings / Amended complaint.pdf<\/option>\n              <\/select>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <label for=\"instr\" style=\"font-size: 14px; font-weight: 500\">Instructions<\/label>\n              <textarea id=\"instr\" rows=\"4\" placeholder=\"Focus areas, format, length, issues to flag…\" style=\"border: 1px solid #b8b8b2; padding: 12px; font-family: inherit; font-size: 14px; resize: vertical\"><\/textarea>\n            <\/div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n              <a href=\"Output.dc.html\" style=\"height: 44px; padding: 0 20px; display: flex; align-items: center; background: {{accent}}; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 500\">Run<\/a>\n              <span style=\"font-size: 13px; color: #5c5c58\">Output saves to this matter's folders and goes to attorney review.<\/span>\n            <\/div>\n          <\/section>\n        <\/sc-if>\n\n      <\/main>\n\n      <aside aria-label=\"Actions\" style=\"{{railStyle}}\">\n      <sc-if value=\"{{railOpen}}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 20px\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between\">\n            <span style=\"font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #4a4a46\">Actions<\/span>\n            <button type=\"button\" onClick=\"{{toggleRail}}\" aria-label=\"Collapse actions panel\" aria-expanded=\"true\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #b8b8b2; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg><\/button>\n          <\/div>\n\n          <section aria-labelledby=\"ready\" style=\"border: 1px solid #1d4f91; background: #f2f6fc; padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n            <h2 id=\"ready\" style=\"margin: 0; display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; font-weight: 600; color: #1d4f91\"><span>Attorney approval<\/span><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px\">{{readyCount}} ready<\/span><\/h2>\n            <sc-for list=\"{{ready}}\" as=\"w\" hint-placeholder-count=\"2\">\n              <div style=\"background: #ffffff; border: 1px solid #b9cfee; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px\">\n                <div style=\"display: flex; flex-direction: column; gap: 3px\">\n                  <span style=\"font-size: 14px; font-weight: 500\">{{w.title}}<\/span>\n                  <span style=\"font-size: 12px; color: #4a4a46\">{{w.meta}}<\/span>\n                <\/div>\n                <div style=\"display: flex; gap: 8px\">\n                  <a href=\"Review.dc.html\" style=\"height: 36px; padding: 0 14px; display: flex; align-items: center; background: #1d4f91; color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 500\">Review<\/a>\n                  <a href=\"Output.dc.html\" style=\"height: 36px; padding: 0 14px; display: flex; a     Logic: (function () {
class Component extends DCLogic {
  constructor(props) {
    super(props);

  }
  renderVals() {
    var self = this;
    var tools = [
      { id: 'overview', label: 'Overview', blurb: '' },

      { id: 'matter', label: 'Matter Management', blurb: 'Budget, staffing, hours and status reporting for this matter.' },

      { id: 'drafting', label: 'Drafting', blurb: 'Draft motions, letters and discovery responses from this matter’s facts and documents.' },
      { id: 'discovery', label: 'Discovery', blurb: 'Organize requests, responses and productions; flag deficiencies.' }
    ];
    var current = tools.find(function (t) { return t.id === self.state.tool; }) || tools[0];
    var base = 'height: 44px; padding: 0 16px; background: transparent; border: none; font-family: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; ';
    var todo = [
      { title: 'Prepare Rule 213(f) witness disclosures', meta: 'Due Nov 2 · Drafting' },
      { title: 'Summarize Okafor deposition', meta: 'Transcript arrives Oct 24 · Deposition Summary' },
      { title: 'Calendar case management conference', meta: 'Nov 12 · Case Management' }
    ];
    var review = [
      { title: 'Privilege log, production vol. 3', meta: 'Paralegal QC · started today', bar: 'width: 60%; height: 4px; background: #5c5c58', progressLabel: '60% reviewed' },
      { title: 'Research memo: lost-profits damages', meta: 'Senior associate · since Oct 16', bar: 'width: 30%; height: 4px; background: #5c5c58', progressLabel: '30% reviewed' }
    ];
    var ready = [
      { title: 'Deposition summary: R. Alvarez', meta: 'AI draft + paralegal check · 14 pp.' },
      { title: 'Responses to second interrogatories', meta: 'Due Nov 6 · 22 answers' }
    ];
    var railOpen = !this.state.railClosed;
    return {
      railOpen: railOpen,
      railClosed: !railOpen,
      railStyle: 'flex: 0 0 ' + (railOpen ? '340px; width: 340px' : '44px; width: 44px') + '; min-width: 0; position: sticky; top: 24px',
      toggleRail: function () { self.setState({ railClosed: railOpen }); },
      accent: this.props.accent ?? '#1c1c1a',
      tabs: tools.map(function (t) {
        var on = t.id === current.id;
        return {
          label: t.label,
          selected: on ? 'true' : 'false',
          style: base + (on ? 'border-bottom: 2px solid #1c1c1a; font-weight: 600; color: #1c1c1a' : 'border-bottom: 2px solid transparent; color: #4a4a46'),
          pick: function () { self.setState({ tool: t.id }); }
        };
      }),
      isOverview: current.id === 'overview',
      isTool: current.id !== 'overview',
      toolName: current.label,
      toolBlurb: current.blurb,
      parties: [
        { role: 'Plaintiff', name: 'Acme Holdings, LLC', counsel: '[Your firm]' },
        { role: 'Defendant', name: 'Delta Supply Co.', counsel: '[Opposing counsel, firm]' },
        { role: 'Third party', name: 'Midwest Freight, Inc.', counsel: 'Unrepresented' }
      ],
      folders: [
        { name: 'Pleadings', count: 6, when: 'Oct 2' },
        { name: 'Discovery', count: 14, when: 'today' },
        { name: 'Deposition summaries', count: 3, when: 'today' },
        { name: 'Research memos', count: 5, when: 'Oct 16' },
        { name: 'Correspondence', count: 9, when: 'Oct 15' },
        { name: 'Drafts', count: 4, when: 'yesterday' }
      ],
      todo: todo, review: review, ready: ready,
      todoCount: todo.length, reviewCount: review.length, readyCount: ready.length
    };
  }
}

z\"><\/path><path d=\"M20 4h-5a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h6z\"><\/path><\/svg>Library<\/a>\n      <a href=\"Connectors.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5\"><\/path><\/svg>Connectors<\/a>\n      <div style=\"margin: 14px 12px 4px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #5c5c58\">Firm admin<\/div>\n      <a href=\"Reports.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\/path><\/svg>Reports<\/a>\n      <a href=\"Admin.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z\"><\/path><path d=\"M9 12l2 2 4-4\"><\/path><\/svg>Admin dashboard<\/a>\n    <\/div>\n    <div style=\"margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-top: 1px solid #dcdcd8\">\n      <div style=\"width: 36px; height: 36px; border-radius: 50%; background: #dcdcd8; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">JD<\/div>\n      <div style=\"display: flex; flex-direction: column; font-size: 13px; line-height: 1.35\">\n        <span style=\"font-weight: 500\">[Attorney Name]<\/span>\n        <span style=\"color: #5c5c58\">[Firm / Client]<\/span>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n\n    <header style=\"padding: 28px 40px 20px; border-bottom: 1px solid #dcdcd8; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between\">\n      <div style=\"display: flex; flex-direction: column; gap: 4px\">\n        <div style=\"font-size: 13px; color: #5c5c58\"><a href=\"Home.dc.html\">Home<\/a> / Review queue<\/div>\n        <h1 style=\"margin: 0; font-size: 28px; font-weight: 600\">Attorney review<\/h1>\n      <\/div>\n      <div style=\"font-size: 14px; color: #4a4a46\">Item 1 of 5 · <a href=\"#\">Previous<\/a> · <a href=\"#\">Next<\/a><\/div>\n    <\/header>\n\n    <sc-if value=\"{{hasBanner}}\" hint-placeholder-val=\"{{ false }}\">\n      <div role=\"status\" style=\"{{bannerStyle}}\">\n        <span style=\"font-weight: 600\">{{bannerTitle}}<\/span>\n        <span>{{bannerText}}<\/span>\n        <button type=\"button\" onClick=\"{{undo}}\" style=\"margin-left: auto; height: 36px; padding: 0 14px; background: transparent; border: 1px solid currentColor; color: inherit; font-family: inherit; font-size: 13px; cursor: pointer\">Undo<\/button>\n      <\/div>\n    <\/sc-if>\n\n    <div style=\"display: flex; flex-wrap: nowrap; align-items: flex-start; gap: 24px; padding: 28px 40px 64px; box-sizing: border-box\">\n\n      <section aria-labelledby=\"queue\" style=\"flex: 0 0 230px; width: 230px; min-width: 0; display: flex; flex-direction: column; gap: 8px\">\n        <h2 id=\"queue\" style=\"margin: 0 0 4px; font-size: 13px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; color: #4a4a46\">Queue · 5<\/h2>\n        <sc-for list=\"{{queue}}\" as=\"q\" hint-placeholder-count=\"5\">\n          <a href=\"#\" class=\"qitem\" style=\"{{q.style}}\">\n            <span style=\"font-size: 14px; font-weight: 500; line-height: 1.35\">{{q.title}}<\/span>\n            <span style=\"font-size: 12px; color: #5c5c58\">{{q.matter}}<\/span>\n            <span style=\"font-size: 12px; color: #4a4a46\">{{q.due}}<\/span>\n          <\/a>\n        <\/sc-for>\n      <\/section>\n\n      <article aria-labelledby=\"rtitle\" style=\"flex: 1 1 auto; min-width: 0; border: 1px solid #dcdcd8; display: flex; flex-direction: column\">\n        <div style=\"padding: 12px 20px; background: #f5f5f3; border-bottom: 1px solid #dcdcd8; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; font-size: 13px\">\n          <span style=\"display: flex; gap: 16px; align-items: center; flex-wrap: wrap\">\n            <span style=\"font-weight: 500\">Suggesting mode<\/span>\n            <span style=\"display: flex; gap: 6px; align-items: center\"><span style=\"width: 14px; height: 2px; background: #1d4f91\" aria-hidden=\"true\"><\/span>Your insertions<\/span>\n            <span style=\"display: flex; gap: 6px; align-items: center\"><span style=\"width: 14px; height: 2px; background: #7a4200\" aria-hidden=\"true\"><\/span>Your deletions<\/span>\n          <\/span>\n          <span style=\"display: flex; gap: 14px\"><a href=\"Output.dc.html\">Open full output<\/a><a href=\"Output.dc.html\">Transcript side-by-side<\/a><\/span>\n        <\/div>\n\n        <div style=\"padding: 32px 40px 40px; display: flex; flex-direction: column; gap: 22px; font-family: 'IBM Plex Serif', Georgia, serif\">\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <div style=\"font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; color: #5c5c58\">Acme Holdings v. Delta Supply · Deposition Summary · v2<\/div>\n            <h2 id=\"rtitle\" style=\"margin: 0; font-size: 26px; font-weight: 600\">Deposition of Ramon Alvarez, CFO of Delta Supply Co.<\/h2>\n          <\/div>\n\n          <section style=\"display: flex; flex-direction: column; gap: 10px\">\n            <h3 style=\"margin: 0; font-size: 18px; font-weight: 600\">Key admissions<\/h3>\n            <ol style=\"margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 12px; font-size: 16px; line-height: 1.65\">\n              <li>Delta Supply received Acme's June 2026 purchase orders and did not dispute pricing before shipment. <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #1d4f91\">[44:3–45:12]<\/span><\/li>\n              <li>The decision to withhold the July shipment was made by Alvarez and the COO, <del style=\"color: #7a4200; text-decoration-thickness: 2px\">not by sales staff<\/del><ins style=\"color: #1d4f91; text-decoration-thickness: 2px\">and Alvarez testified sales staff were not consulted<\/ins>. <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #1d4f91\">[88:19–90:4]<\/span>\n                <div style=\"margin-top: 8px; padding: 10px 12px; background: #f5f5f3; border: 1px solid #dcdcd8; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; line-height: 1.5; color: #2e2e2b\"><span style=\"font-weight: 600\">You · comment:<\/span> Track his exact words; we'll use this line at summary judgment.<\/div>\n              <\/li>\n              <li>No written notice of breach was sent to Acme before the shipment was withheld<ins style=\"color: #1d4f91; text-decoration-thickness: 2px\">, contrary to § 9.2 of the supply agreement<\/ins>. <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #1d4f91\">[102:7–14]<\/span><\/li>\n            <\/ol>\n          <\/section>\n\n          <section style=\"display: flex; flex-direction: column; gap: 10px\">\n            <h3 style=\"margin: 0; font-size: 18px; font-weight: 600\">Summary by topic (excerpt)<\/h3>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65\"><span style=\"font-weight: 600\">July shipment hold [86–97].<\/span> Hold ordered over a disputed credit balance; <del style=\"color: #7a4200; text-decoration-thickness: 2px\">concedes<\/del><ins style=\"color: #1d4f91; text-decoration-thickness: 2px\">admits<\/ins> the balance was under the contract threshold.<\/p>\n            <div style=\"padding: 10px 12px; background: #fff1e0; border: 1px solid #e8c9a0; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; line-height: 1.5; color: #4a2a00\"><span style=\"font-weight: 600\">AI check:<\/span> The cite 86–97 also covers testimony on the credit hold policy. Consider splitting into its own topic.<\/div>\n          <\/section>\n        <\/div>\n      <\/article>\n\n      <aside aria-label=\"Actions\" style=\"{{railStyle}}\">\n      <sc-if value=\"{{railOpen}}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 20px\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between\">\n            <span style=\"font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #4a4a46\">Actions<\/span>\n            <button type=\"button\" onClick=\"{{toggleRail}}\" aria-label=\"Collapse actions panel\" aria-expanded=\"true\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #b8b8b2; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg><\/button>\n          <\/div>\n\n          <section aria-labelledby=\"decide\" style=\"border: 1px solid #1d4f91; background: #f2f6fc; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n            <h2 id=\"decide\" style=\"margin: 0; font-size: 16px; font-weight: 600; color: #1d4f91\">Attorney approval<\/h2>\n            <p style=\"margin: 0; font-size: 13px; color: #4a4a46; line-height: 1.5\">Deposition summary: R. Alvarez · v2<\/p>\n            <button type=\"button\" onClick=\"{{approve}}\" style=\"height: 48px; background: #1d4f91; color: #ffffff; border: none; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer\">Approve &amp; release to client<\/button>\n            <button type=\"button\" onClick=\"{{changes}}\" style=\"height: 44px; background: #ffffff; border: 1px solid #1c1c1a; font-family: inherit; font-size: 14px; cursor: pointer\">Request changes<\/button>\n            <button type=\"button\" onClick=\"{{cancel}}\" style=\"height: 44px; background: #ffffff; border: 1px solid #b8b8b2; color: #7a4200; font-family: inherit; font-size: 14px; cursor: pointer\">Cancel workflow<\/button>\n            <a href=\"SendReview.dc.html\" style=\"font-size: 13px; color: #1d4f91\">Not sure? Send it to LawCompany review instead<\/a>\n            <p style=\"margin: 0; font-size: 12px; color: #4a4a46; line-height: 1.5\">Approving saves the final version to the matter folder and marks the workflow complete.<\/p>\n          <\/section>\n\n        <section aria-labelledby=\"check\" style=\"border: 1px solid #dcdcd8; padding: 20px; display: flex; flex-direction: column; gap: 12px\">\n          <h2 id=\"check\" style=\"margin: 0; font-size: 15px; font-weight: 600\">Review checklist<\/h2>\n          <label style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 14px\"><input type=\"checkbox\" checked=\"\" style=\"width: 18px; height: 18px; margin: 1px 0 0\">Page:line cites match transcript<\/label>\n          <label style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 14px\"><input type=\"checkbox\" checked=\"\" style=\"width: 18px; height: 18px; margin: 1px 0 0\">Facts consistent with pleadings<\/label>\n          <label style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 14px\"><input type=\"checkbox\" style=\"width: 18px; height: 18px; margin: 1px 0 0\">Privilege and confidentiality marked<\/label>\n          <label style=\"display: flex; gap: 10px; align-items: flex-start; font-size: 14px\"><input type=\"checkbox\" style=\"width: 18px; height: 18px; margin: 1px 0 0\">Ready for client to read<\/label>\n        <\/section>\n\n        <section aria-labelledby=\"note\" style=\"border: 1px solid #dcdcd8; padding: 20px; display: flex; flex-direction: column; gap: 10px\">\n          <h2 id=\"note\" style=\"margin: 0; font-size: 15px; font-weight: 600\">Note to team<\/h2>\n          <label for=\"notebox\" style=\"font-size: 13px; color: #4a4a46\">Sent with \"Request changes\" or \"Approve\"<\/label>\n          <textarea id=\"notebox\" rows=\"3\" placeholder=\"What should change, or anything the client should know\" style=\"border: 1px solid #b8b8b2; padding: 10px; font-family: inherit; font-size: 14px; resize: vertical\"><\/textarea>\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <label for=\"time\" style=\"font-size: 13px; color: #4a4a46\">Review time (counts toward monthly hours)<\/label>\n            <input id=\"time\" type=\"text\" value=\"0.4 hrs\" style=\"height: 40px; border: 1px solid #b8b8b2; padding: 0 10px; font-family: 'IBM Plex Mono', monospace; font-size: 14px\">\n          <\/div>\n        <\/section>\n\n        <\/div>\n      <\/sc-if>\n      <sc-if value=\"{{railClosed}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 14px\">\n          <button type=\"button\" onClick=\"{{toggleRail}}\" aria-label=\"Expand actions panel\" aria-expanded=\"false\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #b8b8b2; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"><\/path><\/svg><\/button>\n          <span role=\"img\" aria-label=\"1 item awaiting your decision\" style=\"min-width: 28px; height: 28px; padding: 0 6px; box-sizing: border-box; border-radius: 14px; background: #1d4f91; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">1<\/span>\n          <span style=\"writing-mode: vertical-rl; font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #4a4a46\">Attorney approval<\/span>\n        <\/div>\n      <\/sc-if>\n      <\/aside>\n\n    <\/div>\n  <\/div>\n<\/div>",
    Logic: (function () {
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { decision: null };
  }
  renderVals() {
    var self = this;
    var d = this.state.decision;
    var banners = {
      approved: { title: 'Approved.', text: 'Final version saved to Deposition summaries and released to the client.', style: 'background: #e3eefc; color: #1d4f91; border-bottom: 1px solid #b9cfee' },
      changes: { title: 'Sent back for changes.', text: 'The paralegal and drafting tool get your redlines and note; it returns to your queue as v3.', style: 'background: #f5f5f3; color: #1c1c1a; border-bottom: 1px solid #dcdcd8' },
      cancelled: { title: 'Workflow cancelled.', text: 'Draft kept in the matter for reference; nothing was released.', style: 'background: #fff1e0; color: #7a4200; border-bottom: 1px solid #e8c9a0' }
    };
    var b = d ? banners[d] : null;
    var base = 'display: flex; flex-direction: column; gap: 3px; padding: 12px 14px; text-decoration: none; ';
    var queue = [
      { title: 'Deposition summary: R. Alvarez', matter: 'Acme v. Delta Supply', due: 'Ready today', on: true },
      { title: 'Responses to second interrogatories', matter: 'Acme v. Delta Supply', due: 'Due Nov 6' },
      { title: 'Ground lease issue memo, rev. 2', matter: 'Northside Plaza', due: 'Due Nov 10' },
      { title: 'Notice of lien and demand letter', matter: 'Ridgeway Construction', due: 'Due Nov 4' },
      { title: 'Vendor MSA redline', matter: 'Harbor Foods', due: 'Due Oct 30' }
    ];
    var railOpen = !this.state.railClosed;
    return {
      railOpen: railOpen,
      railClosed: !railOpen,
      railStyle: 'flex: 0 0 ' + (railOpen ? '340px; width: 340px' : '44px; width: 44px') + '; min-width: 0; position: sticky; top: 24px',
      toggleRail: function () { self.setState({ railClosed: railOpen }); },
      hasBanner: !!b,
      bannerTitle: b ? b.title : '',
      bannerText: b ? b.text : '',
      bannerStyle: 'display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 40px; font-size: 14px; ' + (b ? b.style : ''),
      approve: function () { self.setState({ decision: 'approved' }); },
      changes: function () { self.setState({ decision: 'changes' }); },
      cancel: function () { self.setState({ decision: 'cancelled' }); },
      undo: function () { self.setState({ decision: null }); },
      queue: queue.map(function (q) {
        return Object.assign({}, q, {
          style: base + (q.on ? 'border: 1px solid #1c1c1a; background: #f5f5f3' : 'border: 1px solid #dcdcd8')
        });
      })
    };
  }
}

    return Component; })()
  },

abel=\"{{r.label}}\"><div style=\"{{r.bar}}\"><\/div><\/div>\n              <\/div>\n            <\/sc-for>\n          <\/section>\n        <\/div>\n      <\/sc-if>\n      <sc-if value=\"{{railClosed}}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display: flex; flex-direction: column; align-items: center; gap: 14px\">\n          <button type=\"button\" onClick=\"{{toggleRail}}\" aria-label=\"Expand actions panel\" aria-expanded=\"false\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #b8b8b2; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"><\/path><\/svg><\/button>\n          <span role=\"img\" aria-label=\"5 items ready for approval\" style=\"min-width: 28px; height: 28px; padding: 0 6px; box-sizing: border-box; border-radius: 14px; background: #1d4f91; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">5<\/span>\n          <span style=\"writing-mode: vertical-rl; font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #4a4a46\">Attorney approval<\/span>\n        <\/div>\n      <\/sc-if>\n    <\/aside>\n  <\/main>\n<\/div>",

        { name: 'New Matter Intake', meta: 'Summit Logistics · step 1 of 5, Conflict Check', bar: 'width: 15%; height: 4px; background: #1c1c1a', label: '15% complete' }
      ]
    };
  }

idth=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M22 2 11 13\"><\/path><path d=\"M22 2 15 22l-4-9-9-4z\"><\/path><\/svg><span style=\"flex: 1\">Projects<\/span><span style=\"font-size: 11px; font-family: 'IBM Plex Mono', monospace; padding: 2px 7px; background: #1c1c1a; color: #ffffff\">2<\/span><\/a>\n      <a href=\"Workflows.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><circle cx=\"6\" cy=\"6\" r=\"2.5\"><\/circle><circle cx=\"18\" cy=\"18\" r=\"2.5\"><\/circle><path d=\"M8.5 6H15a3 3 0 0 1 3 3v6.5M6 8.5V15a3 3 0 0 0 3 3h6.5\"><\/path><\/svg>Workflows<\/a>\n      <a href=\"Chat.dc.html\" class=\"navlink\" aria-current=\"page\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; background: #ffffff; border: 1px solid #dcdcd8; font-weight: 500; font-size: 15px\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M4 5h16v11H9l-5 4z\"><\/path><\/svg>Chat<\/a>\n      <div style=\"margin: 14px 12px 4px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #5c5c58\">Firm resources<\/div>\n      <a href=\"Library.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M4 4h5a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z\"><\/path><path d=\"M20 4h-5a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h6z\"><\/path><\/svg>Library<\/a>\n      <a href=\"Connectors.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5\"><\/path><\/svg>Connectors<\/a>\n      <div style=\"margin: 14px 12px 4px; font-size: 11px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #5c5c58\">Firm admin<\/div>\n      <a href=\"Reports.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\/path><\/svg>Reports<\/a>\n      <a href=\"Admin.dc.html\" class=\"navlink\" style=\"display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; text-decoration: none; font-size: 15px; border: 1px solid transparent\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z\"><\/path><path d=\"M9 12l2 2 4-4\"><\/path><\/svg>Admin dashboard<\/a>\n    <\/div>\n    <div style=\"margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-top: 1px solid #dcdcd8\">\n      <div style=\"width: 36px; height: 36px; border-radius: 50%; background: #dcdcd8; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">JD<\/div>\n      <div style=\"display: flex; flex-direction: column; font-size: 13px; line-height: 1.35\">\n        <span style=\"font-weight: 500\">[Attorney Name]<\/span>\n        <span style=\"color: #5c5c58\">[Firm / Client]<\/span>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; padding: 32px 48px 40px; box-sizing: border-box; display: flex; flex-wrap: nowrap; align-items: flex-start; gap: 32px\">\n    <div style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 20px; max-width: 900px\">\n\n      <header style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid #dcdcd8; padding-bottom: 16px\">\n        <div style=\"display: flex; flex-direction: column; gap: 4px\">\n          <h1 style=\"margin: 0; font-size: 28px; font-weight: 600\">Chat<\/h1>\n          <p style=\"margin: 0; font-size: 14px; color: #4a4a46\">Ask about any matter, the firm library, or outside sources. Choose the scope in the box below.<\/p>\n        <\/div>\n        <button type=\"button\" style=\"height: 40px; padding: 0 16px; background: #ffffff; border: 1px solid #1c1c1a; font-family: inherit; font-size: 14px; cursor: pointer\">+ New chat<\/button>\n      <\/header>\n\n      <section aria-label=\"Conversation\" style=\"display: flex; flex-direction: column; gap: 24px\">\n        <div style=\"align-self: flex-end; max-width: 78%; display: flex; flex-direction: column; gap: 8px; align-items: flex-end\">\n          <div style=\"background: #f5f5f3; border: 1px solid #dcdcd8; padding: 14px 16px; font-size: 15px; line-height: 1.55\">Delta says we never gave notice of breach. What does the record show, and how does our firm usually frame a notice defense in Cook County?<\/div>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px\">\n            <span style=\"padding: 3px 8px; border: 1px solid #b8b8b2\">Matter: Acme v. Delta Supply<\/span>\n            <span style=\"padding: 3px 8px; border: 1px solid #b8b8b2\">Library: Practice area rules, Firm voice<\/span>\n            <span style=\"padding: 3px 8px; border: 1px solid #b8b8b2\">LexisNexis<\/span>\n          <\/div>\n        <\/div>\n\n        <article aria-label=\"Assistant answer\" style=\"display: flex; flex-direction: column; gap: 12px; max-width: 92%\">\n          <div style=\"display: flex; align-items: center; gap: 10px; font-size: 13px; color: #4a4a46\">\n            <span style=\"width: 28px; height: 28px; border: 1.5px solid #1c1c1a; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #1c1c1a\">AI<\/span>\n            <span>Assistant · Claude Opus 5.5<\/span>\n            <span style=\"padding: 2px 8px; background: #fff1e0; color: #7a4200; font-size: 12px\">Not attorney-reviewed<\/span>\n          <\/div>\n          <div style=\"font-size: 15px; line-height: 1.65; display: flex; flex-direction: column; gap: 12px\">\n            <p style=\"margin: 0\"><span style=\"font-weight: 600\">The record favors Acme on notice.<\/span> Delta's CFO admitted no written notice of breach was sent before the July hold <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #1d4f91\">[Alvarez dep. 102:7–14]<\/span>, and the supply agreement requires written notice and a 10-day cure period <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #1d4f91\">[Supply agreement § 9.2]<\/span>. Delta's interrogatory answer no. 7 dates notice to a June phone call, which Alvarez could not confirm <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #1d4f91\">[Delta Ans. to Interrog. 7]<\/span>.<\/p>\n            <p style=\"margin: 0\"><span style=\"font-weight: 600\">How the firm frames it.<\/span> The litigation voice guide leads with the contract's notice clause, then the admission, then the cure period that never started. Keep the tone factual and avoid characterizing intent <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #1d4f91\">[Firm voice: Litigation briefs §3]<\/span>.<\/p>\n            <p style=\"margin: 0\"><span style=\"font-weight: 600\">Authority to check.<\/span> LexisNexis returned two Illinois appellate decisions enforcing written-notice clauses strictly. Verify both before relying on them <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #1d4f91\">[LexisNexis: 2 results]<\/span>.<\/p>\n          <\/div>\n          <details style=\"border: 1px solid #dcdcd8; padding: 10px 14px; font-size: 13px\">\n            <summary style=\"cursor: pointer; font-weight: 500\">Sources used (6)<\/summary>\n            <ul style=\"margin: 10px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: #4a4a46\">\n              <li>Acme v. Delta / Discovery / Alvarez deposition transcript (Oct 12).pdf<\/li>\n              <li>Acme v. Delta / Pleadings / Supply agreement (2025).pdf<\/li>\n              <li>Acme v. Delta / Discovery / Delta answers to interrogatories.pdf<\/li>\n              <li>Library / Firm voice / Litigation briefs guide v3<\/li>\n              <li>Library / Jurisdictional rules / Cook County Law Division<\/li>\n              <li>LexisNexis / 2 Illinois appellate decisions<\/li>\n            <\/ul>\n          <\/details>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n            <button type=\"button\" style=\"height: 36px; padding: 0 12px; background: #ffffff; border: 1px solid #b8b8b2; font-family: inherit; font-size: 13px; cursor: pointer\">Copy<\/button>\n            <button type=\"button\" style=\"height: 36px; padding: 0 12px; background: #ffffff; border: 1px solid #b8b8b2; font-family: inherit; font-size: 13px; cursor: pointer\">Save to matter<\/button>\n            <a href=\"Workflows.dc.html\" style=\"height: 36px; padding: 0 12px; display: flex; align-items: center; border: 1px solid #b8b8b2; box-sizing: border-box; text-decoration: none; font-size: 13px\">Start a workflow from this<\/a>\n          <\/div>\n        <\/article>\n      <\/section>\n\n      <form aria-label=\"Ask\" style=\"border: 1px solid #1c1c1a; display: flex; flex-direction: column; margin-top: 8px\">\n        <label for=\"chatbox\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Message<\/label>\n        <textarea id=\"chatbox\" rows=\"3\" placeholder=\"Ask a follow-up, or ask about another matter…\" style=\"border: none; padding: 16px; font-family: inherit; font-size: 15px; resize: vertical\"><\/textarea>\n\n        <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; padding: 12px 16px; border-top: 1px solid #dcdcd8; background: #fafaf8\">\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <label for=\"cmatter\" style=\"font-size: 12px; color: #4a4a46\">Matter<\/label>\n            <select id=\"cmatter\" style=\"height: 38px; min-width: 210px; border: 1px solid #b8b8b2; padding: 0 8px; font-family: inherit; font-size: 13px; background: #ffffff\">\n              <option>Acme Holdings v. Delta Supply<\/option>\n              <option>All my matters<\/option>\n              <option>No matter (general question)<\/option>\n              <option>Northside Plaza ground lease<\/option>\n              <option>Ridgeway Construction lien<\/option>\n              <option>Harbor Foods vendor MSA<\/option>\n            <\/select>\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <label for=\"clib\" style=\"font-size: 12px; color: #4a4a46\">Library<\/label>\n            <select id=\"clib\" style=\"height: 38px; min-width: 200px; border: 1px solid #b8b8b2; padding: 0 8px; font-family: inherit; font-size: 13px; background: #ffffff\">\n              <option>Practice area rules + Firm voice<\/option>\n              <option>Entire firm library<\/option>\n              <option>Firm voice &amp; style<\/option>\n              <option>Practice area rules<\/option>\n              <option>Jurisdictional rules<\/option>\n              <option>Practice area guides<\/option>\n              <option>Templates &amp; precedents<\/option>\n              <option>Contract playbooks<\/option>\n              <option>Don't use the library<\/option>\n            <\/select>\n          <\/div>\n          <div style=\"display: flex; flex-direction: column; gap: 4px\">\n            <label for=\"cmodel\" style=\"font-size: 12px; color: #4a4a46\">Model<\/label>\n            <select id=\"cmodel\" style=\"height: 38px; min-width: 170px; border: 1px solid #b8b8b2; padding: 0 8px; font-family: inherit; font-size: 13px; background: #ffffff\">\n              <option>Claude Opus 5.5<\/option>\n              <option>Claude Sonnet 5.5<\/option>\n              <option>Claude Haiku 5.5<\/option>\n              <option>Firm-hosted model<\/option>\n            <\/select>\n          <\/div>\n          <button type=\"button\" onClick=\"{{toggleSources}}\" aria-expanded=\"{{sourcesExpanded}}\" style=\"height: 38px; padding: 0 12px; background: #ffffff; border: 1px solid #b8b8b2; font-family: inherit; font-size: 13px; cursor: pointer\">Sources ({{sourceCount}}) ▾<\/button>\n          <button type=\"button\" style=\"margin-left: auto; height: 44px; padding: 0 22px; background: {{accent}}; color: #ffffff; border: none; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer\">Send<\/button>\n        <\/div>\n\n        <div style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-top: 1px solid #dcdcd8\">\n          <span style=\"font-size: 12px; color: #4a4a46; margin-right: 4px\">Outside tools<\/span>\n          <sc-for list=\"{{tools}}\" as=\"t\" hint-placeholder-count=\"5\">\n            <button type=\"button\" aria-pressed=\"{{t.pressed}}\" onClick=\"{{t.toggle}}\" style=\"{{t.style}}\">{{t.label}}<\/button>\n          <\/sc-for>\n          <a href=\"Connectors.dc.html\" style=\"font-size: 12px; margin-left: 4px\">Manage connectors<\/a>\n        <\/div>\n\n        <sc-if value=\"{{showSources}}\" hint-placeholder-val=\"{{ false }}\">\n          <fieldset style=\"margin: 0; border: none; border-top: 1px solid #dcdcd8; padding: 14px 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; background: #fafaf8\">\n            <legend style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Select sources<\/legend>\n            <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 13px\">\n              <span style=\"font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; color: #4a4a46\">Matter documents<\/span>\n              <label style=\"display: flex; gap: 8px; align-items: center\"><input type=\"checkbox\" checked=\"\" style=\"width: 16px; height: 16px\">Alvarez transcript<\/label>\n              <label style=\"display: flex; gap: 8px; align-items: center\"><input type=\"checkbox\" checked=\"\" style=\"width: 16px; height: 16px\">Supply agreement<\/label>\n              <label style=\"display: flex; gap: 8px; align-items: center\"><input type=\"checkbox\" checked=\"\" style=\"width: 16px; height: 16px\">Interrogatory answers<\/label>\n              <label style=\"display: flex; gap: 8px; align-items: center\"><input type=\"checkbox\" style=\"width: 16px; height: 16px\">Amended complaint<\/label>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 13px\">\n              <span style=\"font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; color: #4a4a46\">Library<\/span>\n              <label style=\"display: flex; gap: 8px; align-items: center\"><input type=\"checkbox\" checked=\"\" style=\"width: 16px; height: 16px\">Firm voice: Litigation<\/label>\n              <label style=\"display: flex; gap: 8px; align-items: center\"><input type=\"checkbox\" checked=\"\" style=\"width: 16px; height: 16px\">Cook County Law Division<\/label>\n              <label style=\"display: flex; gap: 8px; align-items: center\"><input type=\"checkbox\" style=\"width: 16px; height: 16px\">Discovery playbook<\/label>\n            <\/div>\n            <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 13px\">\n              <span style=\"font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.06em; color: #4a4a46\">Connected stores<\/span>\n              <label style=\"display: flex; gap: 8px; align-items: center\"><input type=\"checkbox\" style=\"width: 16px; height: 16px\">SharePoint: Litigation<\/label>\n              <label style=\"display: flex; gap: 8px; align-items: center\"><input type=\"checkbox\" style=\"width: 16px; height: 16px\">Google Drive: Acme shared<\/label>\n            <\/div>\n          <\/fieldset>\n        <\/sc-if>\n      <\/form>\n      <p style=\"margin: 0; font-size: 12px; color: #5c5c58\">Answers are research aids. Anything sent to a client goes through attorney approval first.<\/p>\n    <\/div>\n\n    <aside aria-label=\"Actions\" style=\"{{railStyle}}\">\n      <sc-if value=\"{{railOpen}}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display: flex; flex-direction: column; gap: 20px\">\n          <div style=\"display: flex; align-items: center; justify-content: space-between\">\n            <span style=\"font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #4a4a46\">Actions<\/span>\n            <button type=\"button\" onClick=\"{{toggleRail}}\" aria-label=\"Collapse actions panel\" aria-expanded=\"true\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #b8b8b2; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg><\/button>\n          <\/div>\n\n          <section aria-labelledby=\"cnext\" style=\"border: 1px solid #1c1c1a; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n            <h2 id=\"cnext\" style=\"margin: 0; font-size: 16px; font-weight: 600\">Next action<\/h2>\n            <p style=\"margin: 0; font-size: 13px; color: #4a4a46; line-height: 1.5\">Keep this answer with the matter, or turn it into work product.<\/p>\n            <button type=\"button\" style=\"height: 44px; background: {{accent}}; color: #ffffff; border: none; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer\">Save to Acme v. Delta<\/button>\n            <a href=\"Workflows.dc.html\" style=\"height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #1c1c1a; text-decoration: none; font-size: 14px\">Draft a brief section from this<\/a>\n            <button type=\"button\" style=\"height: 40px; background: #ffffff; border: 1px solid #b8b8b2; font-family: inherit; font-size: 14px; cursor: pointer\">Attorney review (your firm)<\/button>\n            <a href=\"SendReview.dc.html\" style=\"height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #1c1c1a; text-decoration: none; font-size: 14px\">LawCompany review<\/a>\n            <a href=\"Submit.dc.html\" style=\"height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #b8b8b2; text-decoration: none; font-size: 14px\">Turn into a LawCompany project<\/a>\n          <\/section>\n\n          <section aria-labelledby=\"recent\" style=\"border: 1px solid #dcdcd8; padding: 16px; display: flex; flex-direction: column; gap: 4px\">\n            <h2 id=\"recent\" style=\"margin: 0 0 6px; fon display: flex; flex-direction: column; font-size: 13px; line-height: 1.35\">\n        <span style=\"font-weight: 500\">[Attorney Name]<\/span>\n        <span style=\"color: #5c5c58\">[Firm / Client]<\/span>\n      <\/div>\n    <\/div>\n  <\/nav>\n\n  <div style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column\">\n    <header style=\"padding: 28px 40px 22px; border-bottom: 1px solid #dcdcd8; display: flex; flex-direction: column; gap: 16px\">\n      <div style=\"font-size: 13px; color: #5c5c58\"><a href=\"Home.dc.html\">Home<\/a> / <a href=\"Workflows.dc.html\">Workflows<\/a> / Notice &amp; Demand<\/div>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px\">\n          <h1 style=\"margin: 0; font-size: 28px; font-weight: 600\">Notice of breach to Delta Supply<\/h1>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13px; color: #4a4a46\">\n            <span>Notice &amp; Demand workflow<\/span><span aria-hidden=\"true\">·<\/span>\n            <a href=\"Matter.dc.html\">Matter: Acme Holdings v. Delta Supply<\/a><span aria-hidden=\"true\">·<\/span>\n            <span>Run today 9:42 AM<\/span>\n            <span style=\"padding: 3px 10px; font-size: 12px; background: #fff1e0; color: #7a4200\">Draft · not attorney-reviewed<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div role=\"tablist\" aria-label=\"Workflow stages\" style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px\">\n        <sc-for list=\"{{stages}}\" as=\"s\" hint-placeholder-count=\"4\">\n          <button type=\"button\" role=\"tab\" aria-selected=\"{{s.selected}}\" onClick=\"{{s.pick}}\" style=\"{{s.style}}\"><span style=\"{{s.numStyle}}\">{{s.n}}<\/span>{{s.label}}<\/button>\n        <\/sc-for>\n      <\/div>\n    <\/header>\n\n    <div style=\"display: flex; flex-wrap: nowrap; align-items: flex-start; gap: 32px; padding: 28px 40px 64px; box-sizing: border-box\">\n      <main style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 22px\">\n\n        <sc-if value=\"{{isFiles}}\" hint-placeholder-val=\"{{ false }}\">\n          <section aria-labelledby=\"wfin\" style=\"display: flex; flex-direction: column; gap: 14px\">\n            <h2 id=\"wfin\" style=\"margin: 0; font-size: 18px; font-weight: 600\">1 · File ingestion<\/h2>\n            <p style=\"margin: 0; font-size: 14px; color: #4a4a46\">This workflow reads the contract, correspondence and invoices. Add files or pull them from the matter.<\/p>\n            <label for=\"wfup\" style=\"display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px; border: 1px dashed #8a8a84; background: #fafaf8; cursor: pointer; text-align: center\">\n              <span style=\"font-size: 15px; font-weight: 500\">Drag files here or browse<\/span>\n              <span style=\"font-size: 13px; color: #5c5c58\">or choose from Acme v. Delta documents<\/span>\n              <input id=\"wfup\" type=\"file\" multiple=\"\" style=\"position: absolute; width: 1px; height: 1px; opacity: 0\">\n            <\/label>\n            <ul style=\"margin: 0; padding: 0; list-style: none; border: 1px solid #dcdcd8\">\n              <sc-for list=\"{{files}}\" as=\"f\" hint-placeholder-count=\"3\">\n                <li style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #dcdcd8; font-size: 14px\">\n                  <span style=\"display: flex; flex-direction: column; gap: 2px\"><span>{{f.name}}<\/span><span style=\"font-size: 12px; color: #5c5c58\">{{f.meta}}<\/span><\/span>\n                  <span style=\"padding: 3px 10px; font-size: 12px; background: #e3eefc; color: #1d4f91\">Ingested<\/span>\n                <\/li>\n              <\/sc-for>\n            <\/ul>\n            <div style=\"display: flex; flex-direction: column; gap: 6px\">\n              <label for=\"wfinst\" style=\"font-size: 14px; font-weight: 500\">Anything the workflow should know?<\/label>\n              <textarea id=\"wfinst\" rows=\"2\" style=\"border: 1px solid #b8b8b2; padding: 10px 12px; font-family: inherit; font-size: 14px; resize: vertical\">Focus on the July shipment hold and the § 9.2 notice clause.<\/textarea>\n            <\/div>\n          <\/section>\n        <\/sc-if>\n\n        <sc-if value=\"{{isOverview}}\" hint-placeholder-val=\"{{ true }}\">\n          <section aria-labelledby=\"wfov\" style=\"border: 1px solid #dcdcd8; padding: 22px; display: flex; flex-direction: column; gap: 14px\">\n            <h2 id=\"wfov\" style=\"margin: 0; font-size: 18px; font-weight: 600\">2 · Matter overview<\/h2>\n            <dl style=\"margin: 0; display: grid; grid-template-columns: 170px 1fr; row-gap: 10px; column-gap: 14px; font-size: 14px\">\n              <dt style=\"color: #5c5c58\">Parties<\/dt><dd style=\"margin: 0\">Acme Holdings, LLC (buyer) · Delta Supply Co. (seller)<\/dd>\n              <dt style=\"color: #5c5c58\">Matter type<\/dt><dd style=\"margin: 0\">Breach of supply agreement<\/dd>\n              <dt style=\"color: #5c5c58\">Governing law<\/dt><dd style=\"margin: 0\">Illinois (§ 14.1)<\/dd>\n              <dt style=\"color: #5c5c58\">Agreement<\/dt><dd style=\"margin: 0\">Supply agreement, Jan 6, 2025<\/dd>\n              <dt style=\"color: #5c5c58\">Key clause<\/dt><dd style=\"margin: 0\">§ 9.2 written notice, 10-day cure<\/dd>\n              <dt style=\"color: #5c5c58\">Amount in dispute<\/dt><dd style=\"margin: 0\">[AMOUNT from invoices]<\/dd>\n            <\/dl>\n            <span style=\"font-size: 12px; color: #5c5c58\">Saved to the matter dashboard. Edit any field to correct it.<\/span>\n          <\/section>\n        <\/sc-if>\n\n        <sc-if value=\"{{isInsights}}\" hint-placeholder-val=\"{{ false }}\">\n          <section aria-labelledby=\"wfci\" style=\"display: flex; flex-direction: column; gap: 14px\">\n            <h2 id=\"wfci\" style=\"margin: 0; font-size: 18px; font-weight: 600\">3 · Case insights<\/h2>\n            <div role=\"tablist\" aria-label=\"Insights\" style=\"display: flex; gap: 2px; border-bottom: 1px solid #dcdcd8\">\n              <sc-for list=\"{{itabs}}\" as=\"t\" hint-placeholder-count=\"4\">\n                <button type=\"button\" role=\"tab\" aria-selected=\"{{t.selected}}\" onClick=\"{{t.pick}}\" style=\"{{t.style}}\">{{t.label}}<\/button>\n              <\/sc-for>\n            <\/div>\n            <sc-if value=\"{{iSummary}}\" hint-placeholder-val=\"{{ true }}\">\n              <p style=\"margin: 0; font-size: 15px; line-height: 1.65\">Delta held the July shipment over a disputed credit balance without the written notice § 9.2 requires. The emails show Delta raised the balance by phone on July 3 but put nothing in writing before the hold on July 8, so the 10-day cure period never started. This supports a breach claim and a demand for the delayed goods or damages.<\/p>\n            <\/sc-if>\n            <sc-if value=\"{{iTimeline}}\" hint-placeholder-val=\"{{ false }}\">\n              <ol style=\"margin: 0; padding: 0; list-style: none; border: 1px solid #dcdcd8\">\n                <sc-for list=\"{{timeline}}\" as=\"e\" hint-placeholder-count=\"4\">\n                  <li style=\"display: grid; grid-template-columns: 90px 1fr; gap: 14px; padding: 12px 16px; border-bottom: 1px solid #dcdcd8; font-size: 14px\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-weight: 500\">{{e.date}}<\/span><span>{{e.text}}<\/span><\/li>\n                <\/sc-for>\n              <\/ol>\n            <\/sc-if>\n            <sc-if value=\"{{iFacts}}\" hint-placeholder-val=\"{{ false }}\">\n              <ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.55\">\n                <li>§ 9.2 requires written notice and a 10-day cure before suspension. <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #1d4f91\">[Agreement p. 14]<\/span><\/li>\n                <li>No written notice from Delta appears in the 14 emails provided. <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #1d4f91\">[Delta emails]<\/span><\/li>\n                <li>The disputed balance was below the § 6.4 credit threshold. <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #1d4f91\">[Invoices, row 22]<\/span><\/li>\n              <\/ul>\n            <\/sc-if>\n            <sc-if value=\"{{iCustom}}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 10px\">\n                <p style=\"margin: 0; font-size: 14px; line-height: 1.55; padding: 12px 14px; background: #fafaf8; border: 1px solid #dcdcd8\"><span style=\"font-weight: 600\">Your instruction:<\/span> focus on the July hold and § 9.2. The hold appears to be the only suspension under the agreement. Delta may argue the July 3 call was notice; the written-notice language and the lack of a follow-up email weigh against that.<\/p>\n                <div style=\"display: flex; gap: 8px\"><label for=\"ci\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Add a custom insight<\/label><input id=\"ci\" placeholder=\"Ask for another insight, e.g. mitigation of damages\" style=\"flex: 1; height: 40px; border: 1px solid #b8b8b2; padding: 0 12px; font-family: inherit; font-size: 14px\"><button type=\"button\" style=\"height: 40px; padding: 0 16px; background: #ffffff; border: 1px solid #1c1c1a; font-family: inherit; font-size: 14px; cursor: pointer\">Add<\/button><\/div>\n              <\/div>\n            <\/sc-if>\n          <\/section>\n        <\/sc-if>\n\n        <sc-if value=\"{{isDraft}}\" hint-placeholder-val=\"{{ false }}\">\n          <section aria-labelledby=\"wfdr\" style=\"border: 1px solid #dcdcd8; display: flex; flex-direction: column\">\n            <div style=\"padding: 12px 18px; background: #f5f5f3; border-bottom: 1px solid #dcdcd8; display: flex; justify-content: space-between; font-size: 13px\"><span id=\"wfdr\" style=\"font-weight: 600\">4 · AI first draft · notice of breach and demand · 2 pages<\/span><span style=\"color: #7a4200\">Draft · not attorney-reviewed<\/span><\/div>\n            <div style=\"padding: 28px 36px; font-family: 'IBM Plex Serif', Georgia, serif; font-size: 15px; line-height: 1.7; display: flex; flex-direction: column; gap: 12px\">\n              <p style=\"margin: 0\">[Date]<\/p>\n              <p style=\"margin: 0\">Delta Supply Co.<br>Attn: [Name], Chief Financial Officer<\/p>\n              <p style=\"margin: 0; font-weight: 600\">Re: Notice of breach of Supply Agreement dated January 6, 2025<\/p>\n              <p style=\"margin: 0\">This letter gives written notice under Section 9.2 that Delta Supply Co. is in breach of the Supply Agreement by withholding the July shipment ordered under purchase orders 1188–1191. Delta did not give the written notice or 10-day cure period that Section 9.2 requires before suspending performance.<\/p>\n              <p style=\"margin: 0; color: #5c5c58; font-style: italic\">…continues: demand for shipment within 10 days, reservation of rights, contact details.<\/p>\n            <\/div>\n          <\/section>\n        <\/sc-if>\n\n        <div style=\"display: flex; justify-content: space-between\">\n          <button type=\"button\" onClick=\"{{prev}}\" style=\"height: 42px; padding: 0 16px; background: #ffffff; border: 1px solid #b8b8b2; font-family: inherit; font-size: 14px; cursor: pointer\">← Previous step<\/button>\n          <button type=\"button\" onClick=\"{{next}}\" style=\"height: 42px; padding: 0 18px; background: {{accent}}; color: #ffffff; border: none; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer\">Next step →<\/button>\n        <\/div>\n      <\/main>\n\n      <aside aria-label=\"Actions\" style=\"{{railStyle}}\">\n        <sc-if value=\"{{railOpen}}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display: flex; flex-direction: column; gap: 20px\">\n            <div style=\"display: flex; align-items: center; justify-content: space-between\">\n              <span style=\"font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #4a4a46\">Actions<\/span>\n              <button type=\"button\" onClick=\"{{toggleRail}}\" aria-label=\"Collapse actions panel\" aria-expanded=\"true\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #b8b8b2; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg><\/button>\n            <\/div>\n            <section aria-labelledby=\"rnext\" style=\"border: 1px solid #1c1c1a; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n              <h2 id=\"rnext\" style=\"margin: 0; font-size: 16px; font-weight: 600\">Next action<\/h2>\n              <p style=\"margin: 0; font-size: 13px; color: #4a4a46; line-height: 1.5\">The draft is ready. Keep the review in your firm, or send it to LawCompany to QC or finish.<\/p>\n              <a href=\"Review.dc.html\" style=\"height: 46px; display: flex; align-items: center; justify-content: center; background: {{accent}}; color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 500\">Attorney review (your firm)<\/a>\n              <a href=\"SendReview.dc.html\" style=\"height: 42px; display: flex; align-items: center; justify-content: center; border: 1px solid #1c1c1a; text-decoration: none; font-size: 14px\">LawCompany review<\/a>\n              <a href=\"Submit.dc.html\" style=\"font-size: 13px; text-align: center\">Or hand off as a full LawCompany project<\/a>\n              <button type=\"button\" style=\"height: 40px; background: #ffffff; border: 1px solid #b8b8b2; font-family: inherit; font-size: 14px; cursor: pointer\">Download draft (.docx)<\/button>\n            <\/section>\n            <section aria-labelledby=\"rrev\" style=\"border: 1px solid #dcdcd8; padding: 16px; display: flex; flex-direction: column; gap: 8px\">\n              <h2 id=\"rrev\" style=\"margin: 0; font-size: 15px; font-weight: 600\">Revise the draft<\/h2>\n              <label for=\"rrevbox\" style=\"font-size: 13px; color: #4a4a46\">What should change?<\/label>\n              <textarea id=\"rrevbox\" rows=\"3\" placeholder=\"e.g. Shorten the cure demand to 7 days\" style=\"border: 1px solid #b8b8b2; padding: 10px; font-family: inherit; font-size: 14px; resize: vertical\"><\/textarea>\n              <button type=\"button\" style=\"height: 40px; background: #ffffff; border: 1px solid #1c1c1a; font-family: inherit; font-size: 14px; cursor: pointer\">Regenerate draft<\/button>\n            <\/section>\n            <section aria-labelledby=\"rsrc\" style=\"border: 1px solid #dcdcd8; padding: 16px; display: flex; flex-direction: column; gap: 6px; font-size: 13px\">\n              <h2 id=\"rsrc\" style=\"margin: 0 0 4px; font-size: 15px; font-weight: 600\">Saved to the matter<\/h2>\n              <span>Acme v. Delta / Correspondence / Notice of breach (draft).docx<\/span>\n              <span style=\"color: #5c5c58\">Overview and insights added to the matter dashboard<\/span>\n            <\/section>\n          <\/div>\n        <\/sc-if>\n        <sc-if value=\"{{railClosed}}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display: flex; flex-direction: column; align-items: center; gap: 14px\">\n            <button type=\"button\" onClick=\"{{toggleRail}}\" aria-label=\"Expand actions panel\" aria-expanded=\"false\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #b8b8b2; cursor: pointer\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1c1c1a\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M15 6l-6 6 6 6\"><\/path><\/svg><\/button>\n            <span role=\"img\" aria-label=\"1 next action\" style=\"min-width: 28px; height: 28px; padding: 0 6px; box-sizing: border-box; border-radius: 14px; background: #1c1c1a; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600\">1<\/span>\n            <span style=\"writing-mode: vertical-rl; font-size: 12px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.08em; color: #4a4a46\">Next action<\/span>\n          <\/div>\n        <\/sc-if>\n      <\/aside>\n    <\/div>\n  <\/div>\n<\/div>",
    Logic: (function () {
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stage: 1, itab: 'summary' };

  renderVals() {
    var self = this;
    var railOpen = !this.state.railClosed;
    var st = this.state.stage;

    var itabBase = 'height: 42px; padding: 0 14px; border: none; background: none; font-family: inherit; font-size: 14px; cursor: pointer; margin-bottom: -1px; ';

    return {

      railStyle: 'flex: 0 0 ' + (railOpen ? '340px; width: 340px' : '44px; width: 44px') + '; min-width: 0; position: sticky; top: 24px',
      toggleRail: function () { self.setState({ railClosed: railOpen }); },
      accent: this.props.accent ?? '#1c1c1a',

        return { n: String(i + 1), label: l, selected: on ? 'true' : 'false', pick: function () { self.setState({ stage: i }); },
          style: btn + (on ? 'background: #1c1c1a; color: #ffffff; border: 1px solid #1c1c1a; font-weight: 500' : 'background: #ffffff; color: #1c1c1a; border: 1px solid ' + (done ? '#1c1c1a' : '#b8b8b2')),
          numStyle: 'width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-family: \'IBM Plex Mono\', monospace; ' + (on ? 'background: #ffffff; color: #1c1c1a' : 'border: 1px solid currentColor') };
      }),

      }),

      files: [

    };
  }
}
